<h3 class="ch">0. Введение</h3>
<p>Во введении будут рассмотрены общая методология, философские концепции с разной степенью дефектности, обоснование применения синтетического эклектизма, разбор диктаторских стимулов к воздействию на уязвимости разума, а также оправданность применения насилия в кризисном положении.</p>
<p>Методология работы носит эклектический характер, так как сочетает аналитическую и континентальную методологии, рационалистическую и эмпирико-натуралистическую эпистемологические стратегии. Использованы операционные методы (абстрагирование, идеализация и концептуализация, интерпретация, метод теста на противоречия и перформативного противоречия, критический метод, постструктуралистская деконструкция), аналитические процедуры (концептуальный анализ, декомпозиционный анализ, интроспективный анализ), логико-аргументативные инструменты (дедукция, индукция, сравнение, анализ и синтез), а также вспомогательные эвристические и моделирующие инструменты (метод визуализации, трансформирование, комбинирование, моделирование, мысленный эксперимент, регулятивное сомнение, апелляция к здравому смыслу).</p>
<p>Для комфортного погружения зафиксируем базовые координаты. Имманентное – материальное и познаваемое, способное тем или иным способом стать чувственным опытом и эмпирикой, а также внутреннее содержание сущего как оно есть. Трансцендентное – не только лежащее за пределами чувственного опыта, но и за пределами единственного мира, его природы, а также принципиально непознаваемое, духовное, мистическое и в рамках работы тождественное Ничто. Всё, что есть (существует) в мире, – имманентное, а то, чего в нём нет (ничто), – трансцендентное. Ввиду обилия терминологии при необходимости лучше воспользоваться сразу несколькими энциклопедическими источниками, в том числе философской энциклопедией, например «Новой философской энциклопедией» [1]. Философский анализ в книге сменяется резкой публицистикой, иногда с элементами патетики. Это создаёт своего рода контрастную, динамическую, отрезвляющую партитуру, которую познавательно и интересно читать.</p>
<p>Каждый человек не хотел бы быть запутанным и обманутым другим человеком, особенно нарочно. Причина такого желания кроется в простой ответственности. Ответственность, которую каждый дееспособный человек имеет, рационально осознаваема и даже понятна интуитивно. Эта ответственность порождает человеческую двунаправленность: ответственность по отношению к собственному «Я» и по отношению ко всему, что во «Вне». Ответственность по отношению к себе характеризуется через осознание необходимости (или ненадобности) и сознательный выбор (или отказ от такого выбора) самоидентичности, морали, нормативной этики, ментальной психотерапии (для исправления того, что внутри), аксиологических ценностей и совокупного образа жизни, а также отношения ко всему, что исходит из Вне. Ответственность по отношению к окружающему более категорична и описательна, в ней практически нет места для сознательного свободного выбора. Она сводится к осознанию тех закономерных последствий, к которым приводят любые действия, влияющие на окружающих людей и общество, природу и экологию, информацию и предметы. При заблуждении в каком-то аспекте можно сделать неправильные выводы, а порой, когда в основе лежит неверная информация, ошибка неизбежна. Это может быть не так страшно, когда заблуждения касаются не очень важных вещей, но нередко они задевают фундаментальную опору личности. Зачастую заблуждения возникают не из-за несовершенства мышления, а намеренно имплантируются внутрь человеческого сознания, что способно подорвать его ментальное состояние или причинить вред его окружению.</p>
<p>Из стремления быть максимально объективным, не подверженным вредному внешнему воздействию, из осознания собственной ответственности следует необходимость критически анализировать и выявлять несовершенства некоторых популярных философских концепций. В особенности тех, что продвигаются в массовом сознании диктаторской идеологией, догматичной религией или просто позицией личности авторитарного типа. Важно также выявлять нарративы, направленные против свободомыслия, отвергающие размышления и ущемляющие людей с принципиальной позицией, на основе которой и формулировалось это произведение. Вспомним некоторые концепции и разберёмся в их изъянах в порядке от наиболее применимых, прикладных и полезных к совсем уж бесполезным и даже вредным для человеческого разума.</p>
<h4 class="ch">0.1. Антагонистические позиции</h4>
<p>Известно множество концепций с разной степенью мракобесия. Здесь не стоит задача дать обзор всем им, но необходимо перечислить основные идеи и подчеркнуть их пользу или вред. Уместнее всего начать с более приемлемых концепций, вроде позитивизма, и постепенно продвигаться к антагонистичным им мистическим и теологическим позициям. Существуют и по большей части нейтральные концепции, но акцентировать на них внимание мы не будем. Разобрать в той или иной степени сомнительные позиции необходимо, чтобы лучше понимать их уловки, не попасть в их ловушки и не зайти с ними в логический тупик.</p>
<p>Позитивизм – подход, популярный среди исследователей эпистемологии, особенно в ситуациях, когда наука сталкивается с внепредметными философскими требованиями. Например, при настойчивом призыве приостановить научную деятельность до тех пор, пока не будет дан ответ на неразрешённый метафизический вопрос. В подобной обстановке неудивительно, что многие учёные склоняются к позитивистскому взгляду, воспринимая всю метафизику как бессмысленную. Однако как последовательная философская позиция позитивизм оказывается во многом вредным или ограниченным. Во-первых, метафизика не сводится к одному направлению, и существует множество метафизических концепций, некоторые из них обладают внутренней логикой, опираются на здравый смысл и представляют значимую часть философии, стремящейся ответить на многие фундаментальные вопросы человеческого разума. Во-вторых, отказ от метафизики нередко выглядит как своеобразная заплатка – временное уклонение от проблемы, отказ от осмысления, что можно расценивать как форму интеллектуального эскапизма или даже обскурантизма. В-третьих, позитивизм, отвергая метафизику, не предлагает взамен полноценной альтернативы для осмысления фундаментальных вопросов, которую дают метафизические концепции [2].</p>
<p>Отдельная проблема – то, как позитивизм критикует религию. Эта критика зачастую формальна или поверхностна, не стремится к конструктивному философскому диалогу, а ограничивается лишь указанием на логическую несостоятельность. Такая позиция ведёт к поляризации мышления: формируются два противоборствующих лагеря, один из которых лишён заинтересованности в поиске метафизических концепций, которые были бы объективно полезны человеку как в понимании своего Я, так и в осмыслении внешнего мира.</p>
<p>Тем не менее позитивизм опирается на целый ряд фундаментальных установок. Он исходит из идеи, что истина едина, объективна и поддаётся верификации. Истину можно выявить через проверяемые методы, соответствующие критериям научного познания, а наивысшей формой её выражения считается научный консенсус, основанный на интерсубъективной эмпирике. Позитивизм, как правило, эмпирически монистичен и материалистичен [3]. Если трансцендентное для него бессмысленно, то в рамках данной книги оно <em>бессущностно</em>, с чего и начнётся первая глава.</p>
<p>Под <em>бессущностным</em> понимается антоним к слову сущее, так же, как Ничто противоположно Бытию. Даже позитивисты, строго говоря, не признают существования абсолютной истины – напротив, они отрицают её как метафизическую категорию. Истина для них – то, что подтверждается наблюдением и опытом в настоящем и может измениться при появлении новых данных.</p>
<p>Позиция автора во многом близка к позитивистской, но с тем важным отличием, что автор признаёт эвристическую и концептуальную полезность философских методов и метафизических ответов. В частности, позитивизм недооценивает значение метафизики экзистенциализма, особенно в формировании Я-концепции. Последняя – не простая функция, обусловленная только внешними детерминистическими и стохастическими факторами. Напротив, каждое Я формируется под влиянием множества факторов, как обусловленных, так и произвольных, включая интеллектуальные акты самоопределения и размышления о рациональном выборе. Таким образом, субъект – сложная структура со свободой воли, осуществляющая самоидентификацию и выбор, несводимые к детерминированным и стохастическим предпосылкам.</p>
<p>Именно в акте рационального размышления и осознанного выбора раскрывается подлинная природа субъективной реальности, она оказывается одновременно недетерминированной и нестохастической. Процессы разума несводимы ни к генетической предзаданности, ни к биохимической случайности. Более того, совокупное влияние этих факторов не способно полностью охватить все возможные сценарии развития в силу чувствительности к исходным условиям даже в детерминированных системах. Разум и свобода субъекта приобретают в экзистенциальной метафизике непреходящее онтологическое значение. Поскольку детерминизм и индетерминизм не описывают реальность в полной мере, требуется какое-то дополнительное, промежуточное понятие.</p>
<p>Постмодернизм тесно связан с последствиями так называемого лингвистического поворота. Он решительно отвергает существование объективной природной реальности, универсальной истины, а также универсальность разума и логики. Тем более постмодернизм не признаёт каких-либо абсолютов в философском или мировоззренческом смысле. Такой ход рассуждений приводит представителей этого направления к выводу, что научное познание и его картина мира не ближе к истине, чем представления, основанные на сверхъестественной или паранормальной мистике, включая эзотерику, колдовство, шаманизм, астрологию и прочие формы иррационального восприятия. Подобный релятивизм, очевидно, противостоит трезвому и разумному взгляду на мир и, кроме того, способен навредить как человеку, так и обществу в целом. Скепсис по отношению к технооптимизму действительно частично оправдан, особенно в аспекте темпов технологических изменений и их неравномерности. Однако это не означает принципиальной невозможности улучшения качества жизни человека и общественного устройства через разумное применение науки и технологий [4].</p>
<p>К метанарративам, в рамках которых маргинализируются альтернативные взгляды, мнения и дискурсы, постмодернисты относятся крайне негативно, считая их инструментами на службе у тоталитаризма. При этом парадоксальным образом в рамках некоторых постмодернистских течений продвигаются идеи, близкие к неомарксизму, в том числе с их собственными универсальными посылами. Однако на практике куда более продуктивным здесь оказывается рационально-казуистический подход. Он предлагает не оценивать нарративы по принадлежности к тем или иным идеологиям, а анализировать наличие или отсутствие системных механизмов подавления мнений, сдерживания плюрализма и свободы суждений. Важно, чтобы участники дискурса стремились к предметному, корректному и добросовестному размышлению, а не к риторическим манипуляциям и уловкам. В отличие от позитивизма, постмодернизм не отрицает метафизику – напротив, допускает её как один из возможных дискурсов. В этой связи важным вкладом постмодернистской мысли становится инструмент деконструкции, разработанный Жаком Деррида.</p>
<p>Неудивительно, что такой подход постмодернистов сравнивают с релятивизмом, восходящим к античным софистам и частично к скептицизму, также утверждающему, что объективной истины не существует. Здесь наблюдается отказ от преемственности в развитии знания и смещение акцента в сторону субъективных условий познания. Любое уточнение и совершенствование знания трактуется как доказательство его изначальной неистинности, что в конечном счёте ведёт к светскому агностицизму. Релятивисты как бы заявляют: «У каждого своя правда», потому что любое знание признаётся недостоверным [5]. Абсолютизация казуистического подхода, условности и субъективности в конечном счёте приводит к тому, что жертву уравнивают с агрессором. Из-за размытия твёрдой и безотносительной позиции исчезают виновные и преступники, а любое решение правовой системы, суда или институциональной инстанции представляется заведомо несправедливым и ошибочным. Такое мышление не только формирует субъективизм, но и может стать идеологическим основанием для оправдания вседозволенности, волюнтаризма, культа насилия, права сильного, консеквенциализма и макиавеллизма. Псевдомистики, опирающиеся на постмодернистский подход, навязывают проблему квалиа как тайну панпсихизма (полипсихизма), намеренно лишённую рационального объяснения. В ход идут софистические спекуляции, основанные на абсурдном бесконечном метарегрессе. Однако эта проблема объясняется как раз рационально – не как онтологическая тайна, а как эпистемологическая сложность в рамках онтологического монистического физикализма и эпистемологически антиредукционистского натурализма.</p>
<p>Другое направление в теории познания, противостоящее рационализму и схожее некоторыми чертами с релятивизмом, – сенсуализм. Он гласит: «Нет ничего в разуме, чего не было бы в чувствах», а главной формой достоверного познания признаёт ощущения, восприятия и представления, поскольку именно в них сосредоточена вся деятельность сознания и из них выводится мышление [6]. Хотя источник этого знания – объективный внешний мир, сенсуализм тяготеет к субъективизму, отвергая возможность познания мира как такового, и делает вывод о целостном познании, которое исходит из внутренних состояний сознания и преобразуется ими. У сенсуализма есть полезная интерпретация, например имматериализм: «Быть – значит быть воспринимаемым». Сенсуалистский подход также лучше позволяет проникнуться эмпатией – без навязчивой проекции. Таким образом, делается упор на имманентность знания: оно может быть истинным, но сами ощущения и опыт не гарантируют его объективности. В сочетании с радикальным скептицизмом, солипсизмом и наивным эмпиризмом сенсуализм способен стать основанием антинаучной или антиинтеллектуальной позиции [7]. Такой подход заменяет размышление догматическим изоляционизмом или когнитивным нигилизмом: «Ты своими глазами это видел? Нет? Пока сам не увижу – не поверю!».</p>
<p>Идеализм – первое упомянутое, прямо обозначенное этим термином в данной главе философское учение, полностью признающее Абсолют как универсальный разум. При этом идеализм активно использует понятие трансцендентного – идеального духовного начала, высшего замысла и высшего разума. Идеализм – понятие широкое и многогранное; он бывает различным по формам, но для нужд данного анализа будет рассматриваться обобщённо, с акцентом на религиозный идеализм. Идеализму свойственно использовать абстрактные, эфемерные и спекулятивные формы выражения, поскольку они позволяют замаскировать отсутствие здравого смысла за философской бутафорией. Идеалисты не соотносят Абсолют с материей, напротив – они утверждают её вторичность по отношению к сознанию, духу, идее. Иногда, по их мнению, материальная реальность – всего лишь продукт мышления. Поэтому эмпирика чувственно воспринимаемого материального мира считается ненадёжным источником знания: подлинная реальность, согласно идеализму, может быть постигнута лишь через внутреннее созерцание. Объективный идеализм Георга Вильгельма Фридриха Гегеля, в котором надличностный разум порождает весь мир, и трансцендентальный идеализм Иммануила Канта различаются прежде всего в вопросе о достижимости абсолютного познания. Согласно Канту, абсолютное познание недостижимо, потому что сознание способно воспринимать только феномены, а не сам ноумен [8–9]. У Гегеля же абсолютное познание осуществляется через движение духа и диалектику противоречий. Одержимость идеей и стремление к её реализации могут становиться основой для консеквенциализма, а в сочетании с релятивизмом – оборачиваться макиавеллизмом, при котором субъективно идеальная цель превращается в культ, а жертвы на пути к ней – человеческие жизни, свобода, благоразумие и любой другой ущерб – перестают иметь значение. Кроме того, идеализм может провоцировать у человека формирование сверхценной идеи-фикс, которая иногда перерастает в личностные расстройства параноидного или шизоидного типа, а в более тяжёлых случаях – в психопатологическое состояние, характерное для шизофрении и аффективных психозов.</p>
<p>Абсолютный (жёсткий) детерминизм – концепция, согласно которой всё, включая человеческие действия, мысли и решения, предопределено предшествующими причинами и законами природы. В рамках этой теории свобода воли представляется невозможной, поскольку любое решение человека – лишь следствие предыдущих факторов, а не результат подлинно свободного выбора. Такой подход немедленно порождает опасные последствия: отказ от собственной субъектности, утрата мотивации к моральному выбору, фанатичный фатализм, исчезновение чувства ответственности, а также склонность к восприятию реальности как матрицы – предопределённой системы, за которую отвечает не человек, а некий высший создатель. Обесценивание личного опыта свободы действия и переживания через его объявление иллюзорным и сведение к слепой причинности без пространства для воли ведёт к редукционизму и игнорированию субъективной реальности. Отрицание моральной ответственности разрушает механизмы морали, основы права и социальной справедливости. Между тем способность человека к моделированию альтернативных сценариев будущего, прогнозированию последствий и осознанному выбору предпочтительного варианта с последующей рефлексией предполагает наличие значимого уровня свободы. Современная наука подтверждает, что, кроме детерминированных факторов, существует и стохастический вклад, как и утверждает позиция индетерминизма [10]. Согласно теории хаоса, даже при наличии начальных условий предсказание точного результата становится невозможным, а значит, вопрос о свободе воли не может решаться однозначно. Возможны различные сценарии, в том числе и из-за стохастических процессов. Сумма детерминированных (физиология, наследственность, социальное окружение, структура мозга, внешние причинные связи) и стохастических (квантовые флуктуации, биохимические реакции, нейронная активность, шум в системах) факторов не исчерпывает всей полноты наблюдаемой реальности. В живом мире всегда остаётся пространство для вероятностно обоснованного рационального поведения в ответ на стимул – поведенческого, смыслового, личностного, когнитивного. Именно здесь реализуется возможность выбора, то есть проявление свободы воли. Реальность допускает множественность исходов и потому соответствует не строгому детерминизму, а концепции <em>интердетерминированной</em> компатибилистской свободы, о чём повествуется подробнее в конце третьей главы.</p>
<p>Абсурдизм, нигилизм и их сочетания утверждают, что мир лишён изначального, абсолютного смысла. Они отвергают как божественную сущность, так и мораль, прогресс, универсальные ценности, идеалы и нормы. Эти системы взглядов акцентируют внимание на чувстве пустоты и внутреннем конфликте между стремлением к смыслу и его отсутствием. Реакции на такой радикальный отказ различны. Они ранжируются от принятия абсурда и жизни вопреки ему до пассивной апатии, безразличия и саморазрушения. Однако абсурдизм и нигилизм по-разному трактуют мораль и ценность жизни: в абсурдизме жизнь может сохранять ценность сама по себе – как акт сопротивления и утверждение свободы, в нигилизме же мораль отрицается полностью, а жизнь, как и всё остальное, теряет всякий смысл и значимость [11].</p>
<p>Из этих позиций, в некотором смешении с экзистенциализмом, можно охарактеризовать ещё одно вредное течение – анархо-нигилизм, или хаотичный анархизм. Он не приемлет никакой внешней власти – государственной, религиозной, экономической или моральной – и отрицает само пребывание под ней. Идея коллектива здесь расценивается как насилие над личностью, а свободная воля, по этой логике, может проявляться только в условиях хаоса – системы без порядка, что, по мнению сторонников этого подхода, и соответствует истинной природе бытия [12]. Подобное мышление, разумеется, также отказывается от универсальных и абсолютных норм: любые представления о добре и зле объявляются лишь конструктами, навязанными властью. В этом заметна близость к постмодернизму. Экзистенциальный подход, в свою очередь, ориентируется на формирование индивидуальных ценностей, исходящих из личного опыта, интуиции и чувства свободы, при осознании их условности, пустоты и преходящей природы, с приоритетом акта действия – воли, импульса, поступка. Так, экзистенциализм может сочетаться со свободой воли и без детерминизма, хаотичного анархизма или нигилизма.</p>
<p>Приоритет удовольствия и всевозможного утилитарного избегания страданий – ключевая телеологическая установка гедонистического эгоцентризма. Эту установку в несколько иной форме разделяет и параллельная философская позиция – эвдемонизм, в котором удовольствие выступает составной частью счастья, а не самоцелью [13]. Несмотря на полезную ориентацию на автономную этику, гедонистический эгоцентризм обычно отвергает как абсолютную, так и универсальную мораль. Сведение всего к субъективному комфорту и идее уникальности каждой личности приводит к противоречию, например, с правовой системой, где субъекты равны, а их интерпретации состязательны. Сам факт преступления предполагает наличие должного – правильного поведения, универсального и обязательного для всех без исключения, а не уникально определяемого по желанию субъекта. Мотивы преступника могут быть учтены, но они, как правило, не оправдывают объективно совершённое деяние. Другие полезные, но не сакральные ценности эгоистичного гедонизма – это свобода бытия, любовь, природа, эстетика и красота. Эти ценности одновременно субъективны, интерсубъективны и утилитарны, и игнорирование этой многослойности – ошибка гедонистического эгоцентризма. Без должного рационализма такая этическая установка легко скатывается в хаос произвола желаний: чревоугодие, зависимость, алчность, консьюмеризм [14].</p>
<p>Инсинуация солипсизма крайне близка к субъективному идеализму. Это инфантильная и синкретическая позиция, отягощённая эгоцентризмом и элементами магического мышления. Это настолько примитивная и интуитивно понятная концепция, что человек способен усваивать её задолго до формирования речи и даже до прямохождения: для младенца исчезновение объекта из поля зрения равнозначно исчезновению самого объекта [15]. Именно поэтому ребёнок искренне реагирует и удивляется, когда взрослый прячет лицо и снова показывается (ку-ку, или peek-a-boo). В мире младенца человек как бы исчезает и появляется в зависимости от его прямого наблюдения. Солипсизм культивирует в человеке чувство исключительности и иллюзию превосходства над всем окружающим. Эта установка способна породить любые философские отклонения: от постмодернизма до сенсуализма, от релятивистской морали до утверждения о существовании абсолютной морали, от эмпиризма до мистицизма, от атеистического экзистенциализма до панпсихизма (полипсихизма) и теологии, даже до гипотезы симуляции. Однако одно остаётся неизменным: солипсизм никогда не ведёт к материализму, экстернализму, универсальной морали и признанию объективной или абсолютной истины.</p>
<p>В дихотомии приоритета между приемлемостью пути и самой целью утилитарный консеквенциализм отдаёт предпочтение результату (консеквенту). Такая позиция оправдывает достижение даже самых возвышенных, идеалистических, сакральных или универсальных целей средствами, унижающими человеческое достоинство, жестокостью и насилием. Это особенно ярко проявляется в абсурдных мысленных экспериментах вроде сценария с тикающей бомбой, где пытки и насилие выставляются допустимыми во имя большего блага. Однако эмпирические исследования эффективности таких методов, включая применение пыток, указывают на их несостоятельность как с точки зрения получения надёжной информации, так и с точки зрения моральной целесообразности [16]. Более того, зло, представленное как рационально необходимое, легко становится заразительным оправданием, способным дегуманизировать жертву и освободить палача от ответственности. Консеквенциализм в таком виде – это моральная ловушка, где средства постепенно стирают любые границы, превращаясь в самоцель. Один из антагонистов консеквенциализма – этика добродетели, акцентирующая внимание не на результате, а на нравственном облике субъекта. Она строится на внутренней мотивации, альтруизме, милосердии, филантропии. Но даже эта система уязвима: её могут использовать беспринципные приспособленцы или карьеристы, имитируя добродетель ради достижения собственных целей. Оптимальным компромиссом между крайностями выступает деонтология. Она ориентируется на сам поступок как на объект моральной оценки, независимо от результата, руководствуясь золотым правилом или категорическим императивом, и способна совмещаться с утилитарными или прагматическими представлениями. Это этика долга, закреплённая в кантианском принципе: действуй так, чтобы максима твоей воли могла стать всеобщим законом природы. Она опирается на свободу воли, персональную ответственность и универсальные нормы. Именно деонтология способна охватывать все элементы морального акта – намерение, поведение и следствие – как единую систему. Судебная практика опирается на деонтологические основания: в случае непреднамеренного вреда признаётся и учитывается отсутствие злого умысла. Здесь этическая оценка поведения кроме результата учитывает и мотивацию. А значит, именно деонтологический подход способен стать устойчивой формулой справедливости без разрушения какого-либо элемента морального акта.</p>
<p>Структурный близнец утилитарного консеквенциализма на практике – макиавеллизм, идеология, оправдывающая удержание и расширение власти любой ценой. Он питается цинизмом, коварством, вероломством, культом грубой силы и презрением к морали. Всё, что укрепляет власть, дозволено, а всё, что мешает, подлежит устранению. Макиавеллизм требует покорности, стремится подавить волю другого, а мораль рассматривает как слабость, которую можно использовать, но не исповедовать. Характерный для макиавеллизма рационализм легко уступает место волюнтаризму, если того требует цель. Макиавелли критиковал папство и не был излишне религиозен, оставаясь при этом приверженцем патриотических воззрений [17]. Хаос, анархия и аморализм его политического реализма были вызваны крахом традиционных и архаичных устоев в эпоху Ренессанса и Реформации, а также утратой твёрдой опоры в виде традиционной морали. Идеализм в такой системе не отрицается полностью – он подчиняется задаче манипуляции, выступая инструментом политтехнологий, идеологического внушения и массового контроля. Сакральные образы, идеи жертвы и высшего блага превращаются в оболочку, удобную для эксплуатации доверия и уязвимости граждан ради более удобного управления. Утилитарный консеквенциализм, в свою очередь, допускает самопожертвование как приемлемое средство для достижения цели. Макиавеллизм идёт дальше, он не просто оправдывает жертвы, а требует их. Он возводит готовность к самопожертвованию в добродетель, но исключительно в контексте лояльности правителю или идеологии. История XX века даёт массу примеров того, как политическая практика макиавеллизма в союзе с утилитарным консеквенциализмом и национализмом выстраивала тоталитарные режимы. Эксплуатация национального мифа, дискриминации и синдрома осаждённой крепости стала удобным инструментом для сплочения населения вокруг вождя, милитаризации общественного сознания, оправдания репрессий, террора, развязывания и ведения захватнических, агрессивных войн. Подобная политическая алхимия позволяет стереть грань между добром и злом, навязать обществу образ врага как метафизической, трансцендентной угрозы.</p>
<p>Историк, политолог и социолог Майкл Манн справедливо указывает на трансцендентность как на отличительную черту фашизма: как идеология третьего пути она призвана вывести человека за пределы обычного опыта, заместив его мифом, страстью, псевдосвященной миссией [18].</p>
<p>Тотальная индоктринация, абсолютная догматизация через наносные, навязанные идеологемы и постулаты, часто сопровождаемые отрицанием субъектности человека – один из наиболее действенных инструментов влияния на личность авторитарного типа. Особенно эффективной она становится в сочетании с патриотической риторикой, конформизмом, коллаборационизмом, традиционализмом и авторитарными установками или их комбинацией, сочетающей перечисленное. В условиях страха, нестабильности и пропагандистского давления восприимчивость к подобному воздействию стремительно возрастает. Разные исследования по-разному оценивают долю людей с выраженным авторитарным типом личности. Одно бесспорно – это статистически значимая группа даже в открытом и свободном обществе [19]. Диктатура, особенно в закрытом традиционалистском сообществе, стремится расширить свою кормовую базу за счёт продуцирования таких личностей, которые склонны к подчинению диктату вождя, ритуалам, традициям и окружающим нравам. Для остальных же создаются условия, при которых фашизация личности становится путём наименьшего сопротивления – персональным движением или менее заметным дрейфом по шкале фашизма (F-scale) [20]. В созданных условиях индивид постепенно принимает авторитарные убеждения: упомянутый консеквенциализм, потворство насилию, оправдание агрессии, допустимость разрушительности, приемлемость проявления силы. Растёт предвзятость, укореняются стереотипы, суеверия и приметы, а твёрдое и жёсткое властвование, деструктивность и озабоченность усиливают мачизм и гомофобию. Характерным становится феномен антиинтероцепции – игнорирование сигналов тела и подавление внутренней чувствительности. Это сопровождается эффектом ложного консенсуса и его проекцией, при котором собственные предрассудки, установки, мысли, характер, страхи и другие чувства переносятся на других и принимаются за их мотивы, намерения, способ познания, уровень размышления и даже стиль интуитивного понимания собеседника [21]. Такой способ восприятия мира сближается с солипсизмом – формой абсолютного субъективизма, субъективного идеализма, а также с особыми формами сенсуализма и постмодернистского релятивизма. Эффекты ложного консенсуса и подмена тезиса (соломенное чучело) здесь нередко возникают не как намеренные манипулятивные приёмы, а как искреннее, но ошибочное продолжение субъективной логики личности авторитарного типа. Авторитарная личность часто просто неспособна распознать иной способ мышления, кроме собственного, и потому автоматически проецирует на других свою слепую покорность чужой воле, имеющей над ней силу или власть. Такой заражённый человек не сопротивляется и сдаётся без боя, после чего воплощает чужую волю хозяина, паразитные ценности. Он – жертва, превращённая в исполнителя. Эта жертва очень вредна для людей, и она никогда не бывает добровольной, потому что заражена неосознанно, подобно вирусному заражению (живого организма или компьютера). Застрявшего в трясине этого болота может вытянуть здоровый внешний спаситель, подсказывая, на что можно опереться, чтобы выползти, не утонуть и не потопить тех, кто рядом. Но заколдованный всеми силами будет стараться отбиться от своего спасения, ведь он уже не различает своего и навязанного, не мыслит, а повторяет, не спорит, а защищается. Он отказывается от диалога, не задаёт вопросов, предпочитая домысливать за собеседника, так как проще выдумать, чем разговаривать, спрашивать и разбираться, обдумывать и понимать. Каждый аргумент он воспринимает не как предложение к размышлению, а как угрозу стабильности. Разговор с авторитарной личностью превращается в бегство от сути, в переключении внимания с логики целого на мелочи, удобные для нападок. Другая отличительная черта нарочно запутанного человека – в диалоге он не может сделать окончательное утверждение, а референс к своей реплике или её цитирование всегда воспринимает как неполное, неправильное или ложное. Раскрытие темы разговора тогда воспринимается как нежелательное и неинтересное – фокус переводится с логики и целостной темы на точечное утверждение. Не стоит путать этот эффект с другим приёмом перевода стрелок, известным как ватэбаутизм (англ. whataboutism; пер. «а что насчёт»). Такие личности склонны отрицать субъектность и самоидентичность других. Они неспособны признать в собеседнике равного и мыслящего, потому что сами отказались от осознанного мышления. Они заражены навязанными властью паразитическими, обслуживающими интересы хозяина или макиавеллиста чужими убеждениями, которые на самом деле противоречат их человеческим ценностям. Таких можно назвать запутанными, заколдованными, одурманенными, а можно – зомби или манкуртами.</p>
<p>…Он никогда не помышлял о бегстве. Для любого рабовладельца самое страшное – восстание раба. Каждый раб потенциально мятежник. Манкурт был единственным в своём роде исключением – ему в корне чужды были побуждения к бунту, неповиновению. Он не ведал таких страстей. И поэтому не было необходимости стеречь его, держать охрану и тем более подозревать в тайных замыслах. Манкурт, как собака, признавал только своих хозяев. С другими он не вступал в общение. Все его помыслы сводились к утолению чрева. Других забот он не знал. Зато порученное дело исполнял слепо, усердно, неуклонно…</p>
<p class="attr"><em>– Чингиз Айтматов. «И дольше века длится день», 1980 г.</em></p>
<p>Согласно роману Чингиза Айтматова «И дольше века длится день», образ манкурта – это метафора человека, лишённого памяти, связей, родства, ценностей и воли. Он – рабское создание, полностью подчинённое хозяину и не помнящее ничего из прошлого, из родства, то есть человек без своей идеи, без собственных убеждений, без всякого понятия о добре и зле [22]. Таков конечный результат идеального авторитарного воздействия. Ведь именно отказ от всех форм родства, в том числе генеалогического, культивировался среди населения в период советского красного террора, при репрессиях по статьям об измене родине, шпионаже, контрреволюционной или антисоветской деятельности и по другим статьям для так называемых врагов народа. Утверждалось, что родственные отношения безусловно являются абсолютно доверительными и взаимно информирующими именно в политическом и личностном плане, и феномен беспамятства родства проявлялся буквально. Манкурт – это не просто идеальный исполнитель, это человек, утративший способность к внутреннему сопротивлению. У него нет собственных взглядов и суверенной позиции, потому что он забыл, как их формировать, исходя из своих жизненных ценностей и сознательных конструктивных размышлений. Он лоялен, конформен, безопасен и покорён своему хозяину. Именно таким людям чужды побуждения к сопротивлению, борьбе, протесту, бунту или неповиновению, они боятся скопления людей и организованности. Идеальный раб не интересуется ни общественной, ни гражданской, ни социальной жизнью, ему безразличен ближний. Его заботит только собственное чрево консьюмеризма – удовлетворение бытовых или базовых потребностей. Всё это приводит лишь к крайней степени их эксплуатации и угнетения хозяином, на радость которому они добровольно сдаются, что в некоторой степени является аллегорией на нынешнее время.</p>
<blockquote>
<p><em>Те</em>, кто готов пожертвовать существенной свободой ради временной безопасности, не заслуживают ни свободы, ни безопасности.</p>
<p>Orig.: «<em>Those who would give up essential Liberty, to purchase a little temporary Safety, deserve neither Liberty nor Safety</em>».</p>
</blockquote>

написанном от имени Ассамблеи Пенсильвании губернатору</em></p>
<p>Развитие в человеке не только авторитарных черт, но и признаков так называемой тёмной триады – макиавеллизма, нарциссизма и психопатии (а в случае тёмной тетрады ещё и садизма) – напрямую служит интересам властвующего над ним. Хотя в той или иной степени эти тёмные аспекты присутствуют в каждом человеке, диктатура вместо того, чтобы приглушать и нивелировать их проявления, напротив, массово, имплицитно и опосредованно поощряет их развитие и закрепление в каждом индивиде. Это осуществляется через культурные коды, пропаганду, модели поведения, социальные нормы, формируя удобного, предсказуемого, послушного и удобоваримого ей подданного. Властвующий диктатор, обладая ярко выраженной макиавеллистской чертой, действует в полном соответствии с утилитарным консеквенциализмом (радикальный агентно-относительный консеквенциализм), где цель оправдывает средства [23]. Однако даже с позиций самого консеквенциализма подобную антисоциальную стратегию нельзя считать моральной: вред, повсеместно причиняемый обществу, разрушение доверия, рост страданий и общее снижение уровня благополучия делают итоговую цель порочной, какой бы объективной или легитимной она ни была [24]. Стратегии авторитаризма в любом случае идут вразрез с общественным благом и базовыми моральными нормами, их нельзя оправдать даже утилитарно. Деструктивный эффект неизбежен как по итогу достижения любой цели, так и в процессе её целесообразной реализации. Власть, основанная на культивировании зла и невежества, не способна принести добро и прогресс – она лишь распространяет страдание и закрепляет его в системе.</p>
<p>Диалектическая логика, оперирующая неопределёнными и плавающими понятиями, нередко приобретает характер софизма, в котором утверждается, будто противоречия являются движущей силой развития. Это развитие предполагается как целенаправленное и ведущее к высшему состоянию, по сути, осуществляющееся через снятие противоречий между тезисом и антитезисом посредством синтеза. Однако подобное утверждение – не более чем метафизическая догма, основанная на безапелляционном допущении и магическом мышлении. В рамках научного подхода такая непроверяемая конструкция не обладает ни фальсифицируемостью, ни верифицируемостью, ни предсказательной силой, ни научной ценностью [25]. Тем не менее ограниченное применение подобной логики допустимо в условиях, где система сформирована из исходных данных, частично или полностью противоречащих друг другу и находящихся в состоянии логического конфликта, когда они игнорируют или взаимоисключают друг друга. В таких случаях, когда каждая из противоречивых частей представляется сопоставимо вероятной, необходимо изучить каждую из них. Однако ключевым остаётся то, что ни один из тезисов не обязан быть истинным – каждый может оказаться ложным. К такому подходу особенно охотно прибегают в демагогии и пропаганде, где задача – не сообщить достоверную информацию с верифицируемыми данными, а создать у слушателя ощущение абсолютной неопределённости и хаоса. Вместо одного фальсифицируемого утверждения на слушателя обрушивается водопад интерпретаций, спекуляций, вопросов без ответов, недоказуемых гипотез, конспирологических теорий и невероятных сценариев.</p>
<p>Обскурантизм может проявляться в различных формах: в интеллектуальной лени, сознательной аргументативной изоляции, псевдодискуссии, сопровождаемой игнорированием, обесцениванием и непоследовательностью промежуточных логических результатов (контрольных точек, или чекпоинтов). Другой формой может быть эпистемическая глухота, исключающая восприятие логических доводов и объяснений. Она может сочетаться с мракобесием, приправленным элементами эгоцентризма, солипсизма, релятивизма, постмодернизма и субъективного идеализма или субъективизма – мировоззренческой установки, при которой человек произвольно определяет критерии чужого или неприемлемого опыта, отгораживаясь от него эмоциональной реакцией вместо рационального анализа. Также она может выражаться в форме наивного эмпиризма, казуистического или избирательного скептицизма, когнитивного изоляционизма и бытового агностицизма. Корни подобных установок могут прорастать из конформизма, болезненно острого восприятия общественного мнения, мнительной и маниакальной обеспокоенности чужой оценкой (о себе) и стремления к внешнему одобрению, в том числе из-за нарциссической уязвимости, зависимости от аффилиации и подчинения личности социуму. Дополнительно их распространению могут способствовать антинаучная позиция, искусственное формирование и поддержание информационного пузыря, социальная поляризация, отсутствие культуры спора и приемлемого уровня дискуссии, а усилению – конспирологическое и магическое мышление, антиинтеллектуальные предпочтения, феномен спирали молчания и группового мышления, включая так называемый парадокс Абилина.</p>
<p>Готтентотская мораль, основанная на двойных стандартах и лицемерии, и гетерономная этика на первый взгляд кажутся разнородными явлениями. Однако на практике макиавеллист использует их вместе как инструменты манипуляции [26]. Готтентотская мораль служит оправданием ксенофобии и воинственности: «Пусть у меня сгорит хата, лишь бы у соседа сдохла корова»; «Не беда, что своя погибла, – плохо, что соседская жива»; «Пусть у меня корова сдохнет, лишь бы у соседа сдохли две»; «Добро – украсть у чужого корову, но ни в коем случае – у своего, это зло». Эти установки иллюстрируют нравственный релятивизм и примитивную логику враг-друг, свой-чужой, которая не допускает универсальных моральных принципов. Человек, исповедующий гетерономную этику, придерживается морали, навязанной извне. В условиях циничного общества с доминирующими двойными стандартами он невольно впитывает этот нарратив, заимствуя общественные нравы как свою нравственность. Его поведение становится конъюнктурным, зависящим от внешней среды, подобно флюгеру, подстраивающемуся под ветер обстоятельств. Гетерономная мораль не предполагает рационального осмысления и критического подхода, но многократно повторяет транслируемую извне пропагандистскую повестку, со временем закрепляя её в сознании как норму. В условиях, где господствует новояз, формируемый одновременно властным принуждением и пассивным попустительским согласием общества, прямое высказывание становится невозможным. Коммуникация вынужденно переходит в иносказательную форму по типу эзопова языка, что замедляет и осложняет передачу смысла, снижая её качество, эффективность, конструктивность и ясность. Цинизм двоемыслия позволяет человеку надевать и снимать воображаемую моральную маску, скрывая под ней подлинное отношение как к себе, так и к другим. Эта бутафория и ширма, навязанная конформными нормами, сконструированными властью, укрепляет моральный релятивизм и делает индивида уязвимым для внешнего влияния. Избежать этой двойственности и уязвимости возможно лишь через следование автономной этике – этике, основанной на универсальных, абсолютных и непротиворечивых моральных принципах. Такая мораль открыта для критики, рационального осмысления, совместного обсуждения, в том числе в публичной дискуссии, и ориентирована как на внутренние ценностные убеждения, так и на общественное благо.</p>
<p>Трансцендентальный холизм утверждает, что познание объекта в его целостности невозможно: ни совокупность частей, ни анализ компонентов не приблизят к абсолютной истине, якобы заложенной в недоступном трансцендентном замысле. Само требование познать трансцендентное делает любую претензию на объективное знание по определению несостоятельной. Истина, согласно этому подходу, существует не в доступных аспектах бытия, а только в неделимом целостном континууме, который можно лишь интуитивно уловить, но невозможно логически или эмпирически верифицировать [27]. Из этого следует, что любой аналитический подход якобы обречён на ложность, а познание через разложение на элементы провозглашается заведомо ошибочным. Более того, в этой парадигме субъект не просто наблюдатель, но часть целого или творение по образу и подобию Бога, а значит, также не подлежит объективной критике как независимый исследователь. Схожее, противостоящее эмпиризму течение – религиозный трансцендентализм, который провозглашает возможность подлинного познания исключительно через высшее откровение, духовную веру и богословие. Мораль в такой системе предписана Божественным законом, а церковь – её земной выразитель и единственный объективный интерпретатор. Свобода воли индивида сводится к примитивному бинарному выбору: либо спасение через праведную покорность, либо грехопадение через любое отклонение. Теология предпочитает мимикрировать под научное учение, маскируясь под объективное знание, отсюда и нелепые титулы вроде доктора богословия. Однако это лишь имитация и фикция, а настоящая научная дисциплина – религиоведение, достаточно узкая междисциплинарная область науки, которая не отождествляется с верой. То же относится и к философии религии, которая исследует религиозные феномены, а не подтверждает догматы. Все теологические дисциплины, собираемые под зонтичным термином теология, – это внутренние, замкнутые в себе церковные практики. Ортодоксальная и официально-церковная теология отвергает внешнюю критику, избегает коммуникации и дискуссии, живёт в условиях аргументативной изоляции. Такой отказ от диалога, критического мышления и открытости ведёт к архаике, пещерной дремучести, мракобесию, дикарству и варварству. Особенно это становится опасным, когда сами члены таких организаций перестают воспринимать друг друга как субъектов: они не спорят, не сомневаются, не ищут истины, а лишь повторяют одни и те же догмы. Особое место в теологии занимает эсхатология – учение о конце света, жизни после смерти и так называемых последних вещах. Этот набор мифов идеально подходит диктатуре: он сладостно усыпляет критическое мышление жителей, потакает гордыне и тщеславию, насаждает иллюзию избранности. Именно здесь возникают такие идеологемы, как богоизбранный народ, с нами Бог, народ-мессия, народ-победитель, святая земля, святая страна, священная война, мученическая жертва, праведный гнев и так далее. Эсхатологическое сознание при необходимости легко трансформируется в ритуализированную пропаганду национального превосходства, сакрализацию насилия и самоотречения. На индивидуальном уровне эсхатология культивирует презрение к земной жизни. Она объявляет её неважной, второстепенной, переоценённой, даже иллюзорной. Главное – жизнь в Боге и для Бога. А значит, человеческое счастье, качество жизни, свобода и развитие – не цель, а помеха. Ведь страшнее всего для человека – смерть духовная, или, переводя на светский язык, жизнь атеистическая. Самопожертвование, смерть ради веры, презрение к телесному и мирскому – вот высшие ценности. В этом кроется гремучая смесь исключительного величия и некрофилии в эсхатологии. Она представляет собой культ смерти и мёртвых, обёрнутый в риторику добродетели.</p>
<p>В том же русле следуют и прочие трансцендентные учения. Креационизм основывается на фанатичной вере в существование Творца и его замысел. Гностицизм – на принципиально возможном гнозисе, то есть личном опыте познания Бога, доступном тем, кто следует духовному пути к просветлению. Смежные доктрины, такие как фидеизм, открыто отказываются от рациональности, логики и эмпирики, провозглашая веру единственным источником истины. К этому же ряду относится неовитализм – учение о некой нематериальной жизненной силе или духовной энергии, не сводимой к науке. Неофинализм утверждает, что в природе и жизни есть изначальный замысел, а некая высшая духовная сущность придаёт им смысл, цель и целесообразность. Ответственность за всё происходящее, согласно этой идее, лежит на этом высшем разуме, а человек должен просто следовать его воле. Такая установка полностью устраняет автономию человеческой воли и морали, подчиняя индивида предполагаемым инструкциям, изложенным извне в высшем откровении. Неофинализм реализует телеологический подход, исключающий случайный фактор и вероятностную природу процессов. Он, как и неовитализм, противостоит редукционизму, но не в гносеологическом смысле (как отстаивание множества методов познания), а в онтологическом: неофинализм не столько объясняет реальность, сколько подгоняет её под заранее заданную интуитивную модель и рационализирует эту интуицию [28–32]. Эти концепции ближе к мистическому холизму, чем к научному антиредукционизму. Их цель не в познании, а в оправдании желанного и интуитивно принятого целостного мироустройства.</p>
<p>Обособленно от церковных направлений стоят иные трансцендентные течения. Спиритуализм – это вера в реальность загробной жизни, существование духовного мира и возможность общения с духами умерших через медиумов и спиритические сеансы. Мистицизм утверждает, что познание Абсолюта, Бога или Универсума возможно не рационально, а через трансрациональное или иррациональное переживание, эмоциональное единение, личностное слияние или интуитивное постижение. В основе этого подхода лежат эмоции, интуиция и вера в существование абсолютной реальности и абсолютной истины [33]. Эзотерика представляет собой совокупность имплицитных тайн и учений, закрытых от несведущих простолюдинов и доступных лишь посвящённым – тем, кто якобы способен воспринимать реальность особым способом через психодуховные практики. Сюда относят оккультизм, алхимию, астрологию и различные синкретические доктрины, претендующие на откровение неких сокровенных истин мироздания. Знания, полученные в рамках эзотерического опыта, крайне субъективны, лишены проверяемости, системности и научной методологии. Поэтому эзотерика с полным основанием считается псевдонаукой [34]. Можно было бы ошибочно принять основную идею данной работы за разновидность, близкую к мистицизму, поскольку она также оперирует абсолютными понятиями. Однако принципиальное отличие заключается в следующем: большинство мистических течений, не утруждая себя доводами, утверждают принципиальную постижимость трансцендентного, тогда как в данной книге прямо признаётся его бессущностность и невозможность познания. Следовательно, допустимы только два варианта: либо мистицизм имеет дело с имманентным, ошибочно называя его трансцендентным, либо тезис о познании трансцендентного ложен.</p>
<p>Наиболее мейнстримное трансцендентное течение сегодня – панпсихизм (полипсихизм). Это представление о всеобщей одушевлённости природы. Согласно ему, материя обладает зачаточным сознанием, а сознание в целом рассматривается как её фундаментальное свойство, дополненное концепцией квалиа [35]. Наряду с этим активно выступают псевдомистики: экстрасенсы, маги и прочие паранормальные адепты внефизического духа, чистого бытия или абсолютного сознания, которые утверждают, что субъективный опыт существует вне природы. Однако при этом они не объясняют, где именно это внеприродное бытие существует, как оно работает и почему его невозможно проверить в условиях контролируемого эксперимента. Ни то ни другое не выходит за пределы красивых спекуляций, инсинуаций и утверждений, лишённых экспериментальной основы и не проверяемых на практике. Однако существуют и безвредные для разума философские, психологические или религиозные концепции, например пантеизм, деизм, пандеизм, эволюционный креационизм, эскапизм и многие другие.</p>
<p>Итак, рассмотрев различные философские направления от позитивизма до совокупности идей трансцендентализма, можно резюмировать суть их противостояния. Позитивизм полностью отвергает метафизику, признавая истину единой, объективной и верифицируемой. Постмодернизм, напротив, отрицает объективность и саму идею истины, объявляя её тоталитарным инструментом подавления, угнетения и лжи, подрывающим плюрализм. Релятивизм идёт дальше, расщепляя истину уже не до метанарративов и дискурсов, а до каждого персонального и субъективного взгляда, лишённого универсальности. В своей радикальной форме сенсуализм сливается с когнитивным нигилизмом и отказывается признавать любой другой субъективный опыт, кроме своего собственного. Идеализм ограниченно полезен, например, в стремлении к совершенству и тривиальном значении перфекционизма. Однако, несмотря на сохранение понятия абсолютного, он не соотносит абсолютное с материей, утверждая, что реальность – лишь продукт мышления. Тем самым отрицается объективная истина, даже если признаётся абсолютная. Идеализм также сохраняет и продвигает трансцендентное. Детерминизм хорошо подходит для анализа причинно-следственных связей, логики и связанной с ними интуиции, но может подрывать свободу воли, указывая на её иллюзорность, что ведёт к фатализму, снижает личную ответственность, осознанность, склонность к рефлексии и усиливает пассивность, конформизм и редукционизм. Абсурдизм и нигилизм вместе с отрицанием трансцендентного и абсолютного отрицают и мораль, а также саму идею прогресса. Анархизм, схожий с ними по тону, оставляет свободу только в состоянии хаоса, противопоставляя себя компатибилизму (совместимость детерминизма и свободы), пытающемуся согласовать свободу воли с причинной необходимостью. Гедонистический эгоцентризм, в отличие от эвдемонизма, ведёт к многочисленным негативным последствиям для социума вследствие отказа от равноправия субъектов и игнорирования уровня счастья вне себя. Солипсизм вовсе отказывает в реальности всему, что находится вне субъективного Я. Утилитарный консеквенциализм может быть ограниченно эффективен и полезен, однако его склонность к парадоксам и моральным коллизиям делает его уязвимым для инструментализации в рамках тоталитарных режимов. В отличие от него, деонтология базируется на моральных обязанностях, независимых от последствий. Идеологическая индоктринация и диктат догм формируют условия, при которых личность теряет автономию, движется к авторитарному мышлению, приобретает и развивает черты тёмной тетрады (макиавеллизма, нарциссизма, психопатии, садизма). Всё это работает в интересах коварных и подлых властвующих структур, а не индивида или общества. Диалектический подход оперирует нефальсифицируемыми переходами и допускает подмену формально-логического противоречия диалектическим. По сути, диалектика совмещает элементы софизма и магического мышления, поскольку допускает логические противоречия и веру в неизбежное высшее состояние через синтез. Обскурантизм из-за естественного стремления сохранить энергию обрекает сознание на изоляцию в пузыре манямирка, на отрыв от знания и просвещения, потерю связи с реальностью, регресс и стагнацию. Готтентотская мораль держится на лицемерии и цинизме для сохранения контакта с реальностью, а гетерономная этика формирует подчинённую и покорную личность, отучает от критического мышления, что идеально подходит для эксплуатации и контроля со стороны угнетателя. Трансцендентальный холизм делает постижение принципиально ограниченным, а достижение объективной предельной истины невозможным, утверждая, что без доступа к трансцендентному познание любых частей всегда будет неполным. Его логика приводит к отказу от объективного знания. Наконец, прочие трансцендентные (спиритуализм, мистицизм, эзотерика, панпсихизм, полипсихизм) и теологические направления (эсхатология, фидеизм, неовитализм, неофинализм) противоречат рационализму наиболее радикально: вместо аргументации предлагается дихотомия в форме принятия или непринятия сакрального высшего знания, подавляется свободомыслие, поощряется самопожертвование, а сам культ приобретает черты зомби-секты и некротического культа. Все эти практики и убеждения находятся в прямом противоречии с рационализмом, ростом самосознания и утверждением личностных ценностей, одновременно облегчая эксплуатацию, манипуляции и контроль над сознанием для управления притеснителями подвластными в нужном им ключе.</p>
<p>После рассмотрения недостатков вредных позиций, их уловок и общей несостоятельности формируется понимание того, как можно обезопасить свою концепцию при её конструировании. Почему следует созидать системную композицию картины мира, мы рассмотрим в следующем параграфе.</p>
<h4 class="ch">0.2. Необходимость и особенность синтетического эклектизма</h4>
<p>Наука раздроблена на отдельные дисциплины, хотя границы между некоторыми предметами размыты. Формирование целостной научной картины мира требует совокупного сочетания всех отраслей знаний. В ряде философских традиций эклектизм принято считать признаком упадка или кризиса мысли. При этом и сама философия разделена на различные направления, из которых ключевыми можно считать онтологию, эпистемологию и этику. Формирование целостной философской системы из фрагментов тоже требует парадигмальной композиции и комплексного сочетания идей. Критики эклектизма могут путать его с синкретизмом. Синкретизм, как и составляющее его синкретическое мышление, соединяет разнородные и противоречащие друг другу положения без их взаимодействия, а также без принципов, методологии, оснований, проработки и целостного синтеза. Эклектизм, напротив, интерактивно и основательно сочетает положения, анализирует и элиминирует противоречия, созидательно синтезируя из них новую, непротиворечивую форму принципов. Открытие и подтверждение теории всего в физике непременно будут считаться беспрецедентным шагом в развитии науки. Однако, когда речь заходит о прогрессе в философии, аналогичный шаг или даже его попытка воспринимается некоторыми строго негативно. Противники прогресса и конкуренции способны мимикрировать под тот или иной конструктивный дискурс ради саботажа и диверсий в своих интересах. Инфантильный синкретизм успешно отделяется от синтетического эклектизма. Формулирование и представление синтетического эклектизма в книге обусловлены несколькими основными причинами:</p>
<p class="num">1. Уникальность предлагаемого взгляда;</p>
<p class="num">2. Органичное совмещение парадигм с избавлением от их противоречий, а также изъянов, недостатков и уязвимостей;</p>
<p class="num">3. Сопротивление навязыванию наносных ложных ценностей свободомыслящему, но подвластному диктату человеку, помощь в его освобождении через разумное самосознание посредством мышления.</p>
<p>Серьёзной ошибкой является демонстративное игнорирование философии и метафизики со стороны значительной части учёных и выдающихся научных просветителей, последовательно придерживающихся околопозитивистских взглядов. Это пренебрежение нередко распространяется и на религиозную тематику: отказ от внимания к религиозным суждениям и даже от поверхностного знакомства с религиоведением. Между тем даже ограниченное знакомство с религиозными верованиями, законами и догматикой способно значительно расширить представление о разнообразии когнитивных форм и эпистемологических стратегий познания. Кроме того, знание религиозных норм позволяет распознать лицемерие одних их носителей, а в случае необходимости – напомнить им, кем они себя позиционируют для окружающих. Это также помогает лучше понять искреннюю приверженность других, чьё поведение действительно соответствует исповедуемым убеждениям.</p>
<p>Серьёзной ошибкой также является отказ от понятия абсолюта со стороны ряда философских направлений, в особенности экзистенциализма и физикализма. Постметафизика, к примеру, утверждает недостижимость абсолюта и отрицает само существование абсолютных истин. Это подрывает основу для сколько-нибудь универсального знания и делает невозможным формирование цельной картины бытия. Несмотря на своё первоначально религиозное и трансцендентное происхождение, понятие абсолюта со временем было секуляризовано и приобрело значимость в логике, математике, естественных науках и философии. Оно стало допустимым и даже необходимым элементом теоретического аппарата для описания универсалий, предельных категорий и гносеологических ориентиров. Во избежание путаницы, под абсолютными понятиями в контексте этого произведения не подразумевается значение синонимичное Абсолюту. Абсолют – отдельное понятие, тождественное высшей духовной сущности (Богу). Написание абсолюта со строчной буквы указывает на секуляризованный, логико-математический смысл абсолютного понятия.</p>
<p>В философии Канта присутствует идея абсолютного разума, которую можно кратко сформулировать как способность разума, направленного к безусловному, постигать вещи сами по себе, то есть формировать о них за пределами чувственного опыта регулятивные идеи, направляющие познание (без претензии на конститутивное знание о них), и конструировать трансцендентные идеи в качестве регулятивных принципов (направляющих разум к безусловному). Выработка регулятивных принципов в любой системе знаний, в том числе в философии, невозможна без систематической самокритики, которая необходима для выявления неточностей, ошибок и заблуждений. Созвучная идея, раскрываемая в данной книге, напротив, противопоставляет абсолютность истины, морали, знания и разума всем трансцендентным концептам. Бессущностное Ничто может пониматься как абсолютное в смысле полной отрицательности бытия. Абсолютность уже вшита как базовая установка при упоминании Ничто, однако бывает нелишним явно подчеркнуть эту безусловность.</p>
<p>Вместо бессущностных проявлений Ничто, навязанных через религиозные или властные нарративы при помощи догм и диктата, читателю будет предложено размышление над философскими суждениями, но после предварительного осознания тех оснований, которые ранее использовались как аргументы против самого акта размышления. В третьей главе будет предложен комплексный взгляд на формы подчинения и закрепощения человеческого разума и рационального начала.</p>
<p>Если после ознакомления с принципами религиозного течения становится ясно, что его последователи, несмотря на признание своей морали гетерономной, тем не менее добровольно и субъективно соглашаются с данной системой нравственных установок, то это позволяет глубже понять их мотивацию, стимулы, границы поведения и потенциальные модели для прогнозирования их поступков. В случае противоречия между их действиями и принципами, с которыми они сами согласились, возникает возможность для аргументированной критики. Такая критика может привести либо к отказу от ранее принятых моральных норм и, как следствие, от принадлежности к религиозному течению, либо к пересмотру поведения в сторону их соблюдения и недопущения подобных нарушений впредь. Это недооценённый, но эффективный механизм, применимый как в развитии личностной осознанности своих ценностей и интересов, так и в межличностной коммуникации, формировании толерантности, ассертивности, преодолении поляризации, апатии и аполитичности. Более того, он способен сыграть важную роль в профилактике и предотвращении преступлений, способствуя осознанию личной ответственности за собственные деяния.</p>
<p>Можно реализовать подобный или аналогичный механизм и в светских условиях, используя деонтологический подход к публичной декларации собственных принципов. Такой социально-этический проект можно было бы реализовать в форме деонтологической декларации, отражающей индивидуальное аксиологическое кредо. Эта декларация могла бы стать инструментом построения нормативных рамок применимости принципа эквивалентности наказания, в том числе для реализации тезиса «Никакой свободы врагам свободы». Благодаря такому подходу стало бы возможным легитимное введение ограничений и специальных мер в отношении тех, кто считает себя превосходящим других, чьими правами можно поступиться, допускает произвольное применение силы, неспровоцированное насилие, декларирует безусловные привилегии перед другими и претендует на ангажированное правоприменение, исключение из всеобщего правового равенства без беспристрастного верховенства закона. Использование деонтологической декларации также позволило бы оценивать обоснованность и уместность таких ограничений и наказаний: если человек допускает определённую форму наказания или мер для других, он должен в первую очередь быть готов применить их к себе.</p>
<p>Философская деконструкция трансцендентного в данной концепции отчасти развивает линию Фридриха Ницше и при этом опирается на принципы эпистемологии Поппера, позитивизма и научного скептицизма [36–37]. Новый подход основывается на онтологическом отрицании заблуждений как несуществующих в имманентной и объективной реальности. В этом контексте Ничто трактуется как онтологический синоним лжи, поскольку любое заблуждение бессущностно, если оно не привело к последствиям в объективной действительности.</p>
<p>Уникальность подхода заключается в разрушении традиционной онтологической дихотомии между имманентным и трансцендентным при сохранении ценности имманентного и абсолютных понятий. Отвергаемая метафизика – это трансцендентное и все его производные (Бог, душа, эсхатология и пр.), поскольку они неотличимы от бессущностного Ничто. В то же время признаётся полезность метафизики на разных уровнях: на личностном – в форме экзистенциализма, на внешнем – как эпистемологический физикализм.</p>
<p>Без создания мощной философской концепции последовательность, целостность и ёмкость адекватного мировоззрения всегда будут в большей или меньшей степени уступать мракобесным маргинальным аналогам. Таким образом, возникает стойкая необходимость в создании синтетической и эклектичной концепции, которая честно и последовательно давала бы исчерпывающие ответы на фундаментальные философские вопросы, при этом отважно, твёрдо и бескомпромиссно противостояла бы тем учениям, которые частично или полностью направлены против её принципов. Особенно актуальным этот запрос становится при внешнем диктующем давлении, оказываемом через мифологизированные идеологемы, опирающиеся на комплексную философскую парадигму.</p>
