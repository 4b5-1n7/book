<h3 class="ch">0. Introduction</h3>
<p>This introduction will examine the general methodology, philosophical concepts with varying degrees of flaw, the rationale for applying synthetic eclecticism, an analysis of dictatorial incentives to exploit the mind’s vulnerabilities, and the justification for the use of violence in a crisis situation.</p>
<p>The methodology of this work is eclectic in nature, as it combines analytical and continental methodologies, as well as rationalist and empirico-naturalistic epistemological strategies. The study employs operational methods (abstraction, idealization and conceptualization, interpretation, the contradiction test and performative contradiction methods, the critical method, and poststructuralist deconstruction), analytical procedures (conceptual analysis, decompositional analysis, and introspective analysis), logical-argumentative tools (deduction, induction, comparison, analysis, and synthesis), as well as auxiliary heuristic and modeling tools (visualization, transformation, combination, modeling, thought experiments, regulative doubt, and appeal to common sense).</p>
<p>To ensure a smooth immersion, let’s establish the basic coordinates. The immanent is that which is material and knowable, capable in one way or another of becoming sensory experience and empirical knowledge, as well as the inner content of existence as it is. The transcendent is not only that which lies beyond sensory experience but also beyond the single world and its nature; it is, in principle, unknowable, spiritual, mystical, and – for the purposes of this work – identical to Nothingness. Everything that is (exists) in the world is immanent, and that which is not in it (nothing) is transcendent. Given the abundance of terminology, it is best to consult several encyclopedic sources at once when necessary, including a philosophical encyclopedia, such as the “New encyclopedia of philosophy” [1]. The philosophical analysis in the book gives way to sharp journalistic writing, sometimes with elements of pathos. This creates a kind of contrasting, dynamic, sobering narrative that is both informative and interesting to read.</p>
<p>No one wants to be misled or deceived by another person, especially on purpose. The reason for this desire lies in a simple sense of responsibility. This responsibility, which every competent person possesses, is rationally understood and even intuitively grasped. This responsibility gives rise to human duality: responsibility toward one’s own “self” and toward everything “outside”. Responsibility toward oneself is characterized by an awareness of the necessity (or lack thereof) and a conscious choice (or refusal to make such a choice) regarding self-identity, morality, normative ethics, mental psychotherapy (to correct what lies within), axiological values, and one’s overall way of life, as well as one’s attitude toward everything that comes from the Outside. Responsibility toward one’s surroundings is more categorical and descriptive; there is practically no room in it for conscious, free choice. It boils down to an awareness of the inevitable consequences resulting from any actions that affect other people and society, nature and the environment, information, and objects. If one is mistaken in some aspect, one may draw incorrect conclusions, and sometimes, when the basis is incorrect information, error is inevitable. This may not be so serious when misconceptions concern matters of little importance, but they often strike at the very foundation of one’s identity. Frequently, misconceptions do not arise from imperfect thinking but are deliberately implanted into the human consciousness, which can undermine one’s mental state or cause harm to one’s surroundings.</p>
<p>Out of a desire to be as objective as possible – free from harmful external influences – and out of an awareness of one’s own responsibility, it is necessary to critically analyze and identify the shortcomings of certain popular philosophical concepts. This is especially true of those promoted in the mass consciousness by dictatorial ideologies, dogmatic religions, or simply the stance of an authoritarian individual. It is also important to identify narratives directed against free thought, which reject reflection and marginalize people holding principled positions – the very foundation upon which this work was written. Let us recall some of these concepts and examine their flaws, starting with the most relevant, practical, and useful ones and moving on to those that are utterly useless and even harmful to the human mind.</p>
<h4 class="ch">0.1. Antagonistic positions</h4>
<p>There are many concepts with varying degrees of obscurantism. The goal here is not to provide an overview of all of them, but rather to list the main ideas and highlight their benefits or harms. It makes the most sense to begin with more acceptable concepts, such as positivism, and gradually move toward the mystical and theological positions that are antagonistic to them. There are also concepts that are largely neutral, but we will not focus on them. It is necessary to examine positions that are questionable to one degree or another in order to better understand their tricks, avoid falling into their traps, and prevent ourselves from reaching a logical impasse with them.</p>
<p>Positivism is an approach popular among epistemologists, especially in situations where science is confronted with philosophical demands that lie outside its own domain. For example, when there are persistent calls to suspend scientific activity until an unresolved metaphysical question has been answered. In such a context, it is not surprising that many scientists lean toward a positivist view, regarding all metaphysics as meaningless. However, as a consistent philosophical position, positivism proves to be harmful or limited in many respects. First, metaphysics is not limited to a single school of thought, and there are many metaphysical concepts, some of which possess internal logic, are grounded in common sense, and represent a significant part of philosophy that seeks to answer many fundamental questions of the human mind. Second, the rejection of metaphysics often appears to be a kind of stopgap – a temporary evasion of the problem, a refusal to engage in meaningful reflection – which can be viewed as a form of intellectual escapism or even obscurantism. Third, by rejecting metaphysics, positivism fails to offer a fully-fledged alternative for understanding fundamental questions, such as that provided by metaphysical concepts [2].</p>
<p>A separate issue is the way positivism criticizes religion. This criticism is often formal or superficial; it does not seek constructive philosophical dialogue but is limited to pointing out logical inconsistencies. Such a position leads to a polarization of thought: two opposing camps emerge, one of which has no interest in seeking metaphysical concepts that would be objectively useful to humans both in understanding their own selves and in making sense of the external world.</p>
<p>Nevertheless, positivism is based on a number of fundamental tenets. It proceeds from the idea that truth is singular, objective, and verifiable. Truth can be revealed through testable methods that meet the criteria of scientific knowledge, and its highest form of expression is considered to be scientific consensus based on intersubjective empiricism. Positivism is, as a rule, empirically monistic and materialistic [3]. While the transcendent is meaningless to positivism, within the framework of this book it is <em>Non-Essential</em> – a point from which the first chapter will begin.</p>
<p><em>Non-essential</em> is understood as the antonym of “being”, just as Nothing is the opposite of Being. Strictly speaking, even positivists do not acknowledge the existence of absolute truth – on the contrary, they deny it as a metaphysical category. For them, truth is that which is confirmed by observation and experience in the present and may change with the emergence of new data.</p>
<p>The author’s position is in many ways similar to that of positivism, but with the important distinction that the author acknowledges the heuristic and conceptual usefulness of philosophical methods and metaphysical answers. In particular, positivism underestimates the significance of existentialist metaphysics, especially in the formation of the concept of the self. The latter is not a simple function determined solely by external deterministic and stochastic factors. On the contrary, each “self” is shaped by a multitude of factors, both conditioned and arbitrary, including intellectual acts of self-determination and reflection on rational choice. Thus, the subject is a complex structure endowed with free will, capable of self-identification and choice, which cannot be reduced to deterministic and stochastic preconditions.</p>
<p>It is precisely in the act of rational reflection and conscious choice that the true nature of subjective reality is revealed; it turns out to be both non-deterministic and non-stochastic. The processes of the mind cannot be reduced to either genetic predetermination or biochemical randomness. Moreover, the combined influence of these factors cannot fully encompass all possible scenarios of development due to sensitivity to initial conditions, even in deterministic systems. In existential metaphysics, the mind and the freedom of the subject acquire enduring ontological significance. Since determinism and indeterminism do not fully describe reality, some additional, intermediate concept is required.</p>
<p>Postmodernism is closely linked to the consequences of the so-called linguistic turn. It categorically rejects the existence of an objective natural reality, universal truth, and the universality of reason and logic. Moreover, postmodernism does not recognize any absolutes in a philosophical or worldview sense. This line of reasoning leads proponents of this movement to conclude that scientific knowledge and its worldview are no closer to the truth than beliefs based on supernatural or paranormal mysticism, including esotericism, witchcraft, shamanism, astrology, and other forms of irrational perception. Such relativism clearly runs counter to a sober and rational view of the world and, moreover, is capable of harming both the individual and society as a whole. Skepticism toward techno-optimism is indeed partially justified, especially regarding the pace of technological change and its uneven distribution. However, this does not mean that it is fundamentally impossible to improve the quality of human life and the social order through the sensible application of science and technology [4].</p>
<p>Postmodernists take an extremely negative view of metanarratives that marginalize alternative perspectives, opinions, and discourses, regarding them as tools in the service of totalitarianism. At the same time, paradoxically, some postmodernist movements promote ideas close to neo-Marxism, including their own universal claims. In practice, however, a rational-casuistic approach proves far more productive here. It proposes not evaluating narratives based on their affiliation with particular ideologies, but rather analyzing the presence or absence of systemic mechanisms for suppressing opinions and curbing pluralism and freedom of judgment. It is important that participants in the discourse strive for objective, accurate, and conscientious reflection, rather than rhetorical manipulation and trickery. Unlike positivism, postmodernism does not deny metaphysics – on the contrary, it accepts it as one of several possible discourses. In this regard, the tool of deconstruction, developed by Jacques Derrida, becomes an important contribution of postmodernist thought.</p>
<p>It is not surprising that this postmodernist approach is compared to relativism, which traces its roots back to the ancient Sophists and, in part, to skepticism, which also asserts that objective truth does not exist. Here, we observe a rejection of continuity in the development of knowledge and a shift in emphasis toward the subjective conditions of cognition. Any refinement or improvement of knowledge is interpreted as proof of its inherent falsity, which ultimately leads to secular agnosticism. Relativists seem to declare, “To each his own truth”, because all knowledge is deemed unreliable [5]. The absolutization of the casuistic approach, arbitrariness, and subjectivity ultimately leads to the victim being equated with the aggressor. Due to the blurring of a firm and absolute position, the guilty and the criminals disappear, and any decision by the legal system, a court, or an institutional body appears to be inherently unjust and erroneous. Such thinking not only fosters subjectivism but can also become an ideological foundation for justifying permissiveness, voluntarism, the cult of violence, the law of the strong, consequentialism, and Machiavellianism. Pseudo-mystics, relying on a postmodernist approach, present the problem of qualia as a mystery of panpsychism (polypsychism), deliberately deprived of a rational explanation. They resort to sophistical speculations based on an absurd, infinite metaregression. However, this problem can in fact be explained rationally – not as an ontological mystery, but as an epistemological complexity within the framework of ontological monistic physicalism and epistemologically anti-reductionist naturalism.</p>
<p>Another school of thought in the theory of knowledge, which stands in opposition to rationalism and shares certain characteristics with relativism, is sensualism. It holds that “There is nothing in the mind that is not in the senses”, and recognizes sensations, perceptions, and representations as the primary forms of reliable knowledge, since it is in them that all mental activity is concentrated and from which thought is derived [6]. Although the source of this knowledge is the objective external world, sensualism leans toward subjectivism, rejecting the possibility of knowing the world as such, and concludes that knowledge is holistic, arising from and transformed by the internal states of consciousness. Sensualism offers a useful interpretation, such as immaterialism: “To be is to be perceived”. The sensualist approach also better enables one to empathize – without intrusive projection. Thus, the emphasis is on the immanence of knowledge: it may be true, but sensations and experience alone do not guarantee its objectivity. When combined with radical skepticism, solipsism, and naive empiricism, sensualism can become the basis for an anti-scientific or anti-intellectual position [7]. This approach replaces reflection with dogmatic isolationism or cognitive nihilism: “Did you see it with your own eyes? No? I won’t believe it until I see it myself!”</p>
<p>Idealism is the first philosophical doctrine mentioned in this chapter – and the first explicitly designated by this term – that fully recognizes the Absolute as universal reason. At the same time, idealism actively employs the concept of the transcendent – the ideal spiritual principle, the supreme design, and the supreme reason. Idealism is a broad and multifaceted concept; it takes various forms, but for the purposes of this analysis, it will be considered in general terms, with an emphasis on religious idealism. Idealism tends to employ abstract, ephemeral, and speculative forms of expression, as these allow it to mask a lack of common sense behind philosophical window dressing. Idealists do not equate the Absolute with matter; on the contrary, they assert that matter is secondary to consciousness, spirit, and idea. Sometimes, in their view, material reality is merely a product of thought. Therefore, empirical knowledge of the sensually perceived material world is considered an unreliable source of knowledge: true reality, according to idealism, can be grasped only through inner contemplation. Georg Wilhelm Friedrich Hegel’s objective idealism, in which a supra-personal reason generates the entire world, and Immanuel Kant’s transcendental idealism differ primarily on the question of the attainability of absolute knowledge. According to Kant, absolute knowledge is unattainable because consciousness is capable of perceiving only phenomena, not the noumenon itself [8–9]. For Hegel, however, absolute knowledge is achieved through the movement of the spirit and the dialectic of contradictions. An obsession with an idea and the pursuit of its realization can form the basis for consequentialism, and when combined with relativism, can turn into Machiavellianism, in which a subjectively ideal goal becomes a cult, and the sacrifices made along the way – human lives, freedom, prudence, and any other harm – cease to matter. Furthermore, idealism can lead a person to develop an overvalued fixation, which sometimes escalates into paranoid or schizoid personality disorders, and in more severe cases, into a psychopathological state characteristic of schizophrenia and affective psychoses.</p>
<p>Absolute (hard) determinism is a concept according to which everything – including human actions, thoughts, and decisions – is predetermined by preceding causes and the laws of nature. Within this theory, free will is deemed impossible, since any human decision is merely a consequence of preceding factors, rather than the result of a genuinely free choice. This approach immediately gives rise to dangerous consequences: the rejection of one’s own subjectivity, the loss of motivation for moral choice, fanatical fatalism, the disappearance of a sense of responsibility, as well as a tendency to perceive reality as a matrix – a predetermined system for which not humans, but some higher creator is responsible. Devaluing personal experiences of freedom of action and experience by declaring them illusory and reducing them to blind causality with no room for free will leads to reductionism and the disregard of subjective reality. The denial of moral responsibility undermines the mechanisms of morality, the foundations of law, and social justice. Meanwhile, a person’s ability to model alternative future scenarios, predict consequences, and consciously choose a preferred option followed by reflection presupposes the existence of a significant degree of freedom. Modern science confirms that, in addition to deterministic factors, there is also a stochastic component, as the position of indeterminism asserts [10]. According to chaos theory, even when initial conditions are known, predicting an exact outcome becomes impossible; therefore, the question of free will cannot be resolved unambiguously. Various scenarios are possible, including those resulting from stochastic processes. The sum of deterministic factors (physiology, heredity, social environment, brain structure, external causal relationships) and stochastic factors (quantum fluctuations, biochemical reactions, neural activity, noise in systems) does not fully account for the entirety of observable reality. In the living world, there is always room for probabilistically grounded rational behavior in response to a stimulus – whether behavioral, semantic, personal, or cognitive. It is precisely here that the possibility of choice is realized – that is, the manifestation of free will. Reality allows for a multiplicity of outcomes and therefore corresponds not to strict determinism but to the concept of <em>interdeterministic</em> compatibilist freedom, as discussed in more detail at the end of Chapter 3.</p>
<p>Absurdism, nihilism, and their combinations assert that the world is devoid of any inherent, absolute meaning. They reject not only the divine essence but also morality, progress, universal values, ideals, and norms. These worldviews emphasize a sense of emptiness and the inner conflict between the search for meaning and its absence. Reactions to such a radical rejection vary. They range from accepting the absurd and living in defiance of it to passive apathy, indifference, and self-destruction. However, absurdism and nihilism interpret morality and the value of life differently: in absurdism, life can retain value in and of itself – as an act of resistance and an affirmation of freedom; in nihilism, on the other hand, morality is completely rejected, and life, like everything else, loses all meaning and significance [11].</p>
<p>From this perspective, mixed to some extent with existentialism, we can characterize yet another harmful trend – anarcho-nihilism, or chaotic anarchism. It rejects any external authority – whether state, religious, economic, or moral – and denies the very notion of being subject to it. The idea of the collective is viewed here as a violation of the individual, and free will, according to this logic, can manifest only in conditions of chaos – a system without order – which, in the opinion of proponents of this approach, corresponds to the true nature of existence [12]. Such thinking, of course, also rejects universal and absolute norms: any notions of good and evil are declared to be merely constructs imposed by authority. Here, a close affinity with postmodernism is evident. The existential approach, in turn, focuses on the formation of individual values based on personal experience, intuition, and a sense of freedom, while recognizing their conventionality, emptiness, and transitory nature, with priority given to the act of action – will, impulse, and deed. Thus, existentialism can be reconciled with free will and without determinism, chaotic anarchism, or nihilism.</p>
<p>The priority of pleasure and the utilitarian avoidance of suffering in every possible way is the key teleological principle of hedonistic egocentrism. This principle is shared, in a somewhat different form, by a parallel philosophical position – eudemonism – in which pleasure is an integral part of happiness rather than an end in itself [13]. Despite its useful orientation toward autonomous ethics, hedonistic egocentrism typically rejects both absolute and universal morality. Reducing everything to subjective comfort and the idea of each individual’s uniqueness leads to a contradiction, for example, with the legal system, where individuals are equal and their interpretations are subject to dispute. The very fact of a crime presupposes the existence of a “proper” – correct – behavior that is universal and binding on everyone without exception, rather than one uniquely defined by the subject’s desires. The criminal’s motives may be taken into account, but they generally do not justify the act objectively committed. Other useful, though not sacrosanct, values of egoistic hedonism include freedom of being, love, nature, aesthetics, and beauty. These values are simultaneously subjective, intersubjective, and utilitarian, and ignoring this multi-layered nature is a mistake of hedonistic egocentrism. Without proper rationalism, such an ethical stance easily descends into the chaos of unchecked desires: gluttony, addiction, greed, and consumerism [14].</p>
<p>The insinuation of solipsism is extremely close to subjective idealism. It is an infantile and syncretic position, burdened by egocentrism and elements of magical thinking. It is such a primitive and intuitively understandable concept that a person is capable of grasping it long before the development of speech and even before walking upright: for an infant, the disappearance of an object from view is equivalent to the disappearance of the object itself [15]. This is precisely why a child reacts with genuine surprise when an adult hides their face and then reappears (peek-a-boo). In a baby’s world, a person seems to disappear and reappear depending on whether the baby is directly observing them. Solipsism cultivates in a person a sense of exclusivity and the illusion of superiority over everything around them. This mindset is capable of giving rise to all manner of philosophical deviations: from postmodernism to sensualism, from relativistic morality to the assertion of the existence of absolute morality, from empiricism to mysticism, from atheistic existentialism to panpsychism (polypsychism) and theology, even to the simulation hypothesis. However, one thing remains constant: solipsism never leads to materialism, externalism, universal morality, or the recognition of objective or absolute truth.</p>
<p>In the dichotomy between the acceptability of the means and the end itself, utilitarian consequentialism gives priority to the result (the consequence). This position justifies the pursuit of even the most lofty, idealistic, sacred, or universal goals through means that degrade human dignity, cruelty, and violence. This is particularly evident in absurd thought experiments such as the ticking-bomb scenario, where torture and violence are presented as permissible in the name of the greater good. However, empirical studies on the effectiveness of such methods, including the use of torture, point to their ineffectiveness both in terms of obtaining reliable information and in terms of moral appropriateness [16]. Moreover, evil, when presented as rationally necessary, easily becomes a contagious justification capable of dehumanizing the victim and absolving the perpetrator of responsibility. Consequentialism in this form is a moral trap, where the means gradually blur all boundaries, becoming an end in themselves. One of the counterpoints to consequentialism is virtue ethics, which focuses not on the outcome but on the moral character of the agent. It is based on intrinsic motivation, altruism, compassion, and philanthropy. But even this system is vulnerable: it can be exploited by unprincipled opportunists or careerists who feign virtue to achieve their own ends. Deontology represents the optimal compromise between these extremes. It focuses on the act itself as the object of moral evaluation, regardless of the outcome, guided by the Golden Rule or the Categorical Imperative, and is capable of being reconciled with utilitarian or pragmatic views. This is the ethics of duty, enshrined in the Kantian principle: act in such a way that the maxim of your will could become a universal law of nature. It is based on free will, personal responsibility, and universal norms. It is deontology that is capable of encompassing all elements of a moral act – intention, behavior, and consequence – as a unified system. Judicial practice is grounded in deontological principles: in cases of unintentional harm, the absence of malicious intent is recognized and taken into account. Here, the ethical assessment of behavior considers not only the outcome but also the motivation. Consequently, it is precisely the deontological approach that can serve as a sustainable formula for justice without undermining any element of the moral act.</p>
<p>The structural counterpart of utilitarian consequentialism in practice is Machiavellianism, an ideology that justifies the retention and expansion of power at any cost. It thrives on cynicism, deceit, treachery, the cult of brute force, and contempt for morality. Anything that strengthens power is permitted, and anything that stands in the way must be eliminated. Machiavellianism demands submission, seeks to suppress the will of others, and views morality as a weakness that can be exploited but not upheld. The rationalism characteristic of Machiavellianism easily gives way to voluntarism if the goal so requires. Machiavelli criticized the papacy and was not overly religious, while remaining a proponent of patriotic views [17]. The chaos, anarchy, and amorality of his political realism were caused by the collapse of traditional and archaic foundations during the Renaissance and the Reformation, as well as by the loss of a firm foundation in the form of traditional morality. Idealism is not entirely rejected in such a system – it is subordinated to the task of manipulation, serving as a tool of political engineering, ideological indoctrination, and mass control. Sacred images, the ideas of sacrifice, and the greater good are transformed into a façade, convenient for exploiting citizens’ trust and vulnerability for the sake of more efficient governance. Utilitarian consequentialism, in turn, permits self-sacrifice as an acceptable means to an end. Machiavellianism goes further; it does not merely justify sacrifices but demands them. It elevates the willingness to sacrifice oneself to a virtue, but exclusively in the context of loyalty to a ruler or an ideology. The history of the 20th century provides numerous examples of how the political practice of Machiavellianism, in alliance with utilitarian consequentialism and nationalism, built totalitarian regimes. The exploitation of national myths, discrimination, and the “besieged fortress” syndrome became a convenient tool for rallying the population around a leader, militarizing public consciousness, justifying repression and terror, and unleashing and waging aggressive, expansionist wars. Such political alchemy blurs the line between good and evil and imposes on society the image of the enemy as a metaphysical, transcendent threat.</p>
<p>Historian, political scientist, and sociologist Michael Mann rightly points to transcendence as a defining feature of fascism: as a “third way” ideology, it is designed to take people beyond the bounds of ordinary experience, replacing it with myth, passion, and a pseudo-sacred mission [18].</p>
<p>Total indoctrination and absolute dogmatization through artificially imposed ideologemes and postulates – often accompanied by the denial of human agency – are among the most effective tools for influencing the authoritarian personality. It becomes particularly effective when combined with patriotic rhetoric, conformism, collaborationism, traditionalism, and authoritarian attitudes – or a combination of these elements. In an environment marked by fear, instability, and propaganda pressure, susceptibility to such influence increases rapidly. Different studies vary in their estimates of the proportion of people with a pronounced authoritarian personality type. One thing is indisputable: this is a statistically significant group even in an open and free society [19]. A dictatorship, especially in a closed, traditionalist community, seeks to expand its support base by producing such individuals who are inclined to submit to the leader’s dictates, rituals, traditions, and prevailing social norms. For the rest, conditions are created under which the fascistization of the individual becomes the path of least resistance – a personal shift or a less noticeable drift along the fascism scale (F-scale) [20]. Under these conditions, the individual gradually adopts authoritarian beliefs: the aforementioned consequentialism, condoning violence, justifying aggression, accepting destructiveness, and viewing the display of force as acceptable. Prejudice grows; stereotypes, superstitions, and omens take root; and firm, harsh rule, destructiveness, and preoccupation with power reinforce machismo and homophobia. The phenomenon of anti-interoception – the ignoring of bodily signals and the suppression of inner sensitivity – becomes characteristic. This is accompanied by the effect of false consensus and its projection, in which one’s own prejudices, attitudes, thoughts, character, fears, and other feelings are transferred onto others and mistaken for their motives, intentions, mode of cognition, level of reflection, and even the style of intuitive understanding of the interlocutor [21]. This way of perceiving the world converges with solipsism – a form of absolute subjectivism and subjective idealism – as well as with specific forms of sensualism and postmodern relativism. The effects of false consensus and the fallacy of the straw man often arise here not as deliberate manipulative tactics, but as a sincere yet erroneous extension of the subjective logic of an authoritarian personality. An authoritarian personality is often simply incapable of recognizing any way of thinking other than their own and therefore automatically projects onto others their own blind submission to an external will that holds power or authority over them. Such an infected person offers no resistance and surrenders without a fight, after which they embody the master’s will and parasitic values. They are a victim turned into an executor. This victim is very harmful to people, and their role is never voluntary, because they are infected unconsciously, much like a viral infection (of a living organism or a computer). A healthy external savior can pull someone stuck in the quagmire of this swamp out by suggesting what to rely on to crawl out, avoid drowning, and prevent those nearby from drowning as well. But the one under a spell will try with all his might to fend off his own salvation, for he can no longer distinguish between what is his own and what has been imposed on him; he does not think but repeats, does not argue but defends himself. He refuses dialogue, asks no questions, preferring to speculate on behalf of his interlocutor, since it is easier to make things up than to talk, ask questions, and sort things out, to reflect and understand. He perceives every argument not as an invitation to reflection, but as a threat to stability. A conversation with an authoritarian personality turns into an evasion of the essence, a shift of attention from the logic of the whole to trivial details that lend themselves to attacks. Another distinctive trait of a deliberately confusing person is that in dialogue, they cannot make a definitive statement, and they always perceive a reference to or quotation of their own remark as incomplete, incorrect, or false. Exploring the topic of the conversation is then perceived as undesirable and uninteresting – the focus shifts from logic and the overall topic to a specific statement. This effect should not be confused with another tactic of shifting the blame known as “whataboutism”. Such individuals tend to deny the agency and self-identity of others. They are incapable of recognizing their conversation partner as an equal and a thinking being, because they themselves have renounced conscious thought. They are infected with parasitic beliefs imposed by those in power – beliefs that serve the interests of a master or a Machiavellian figure – which actually contradict their own human values. Such people can be called confused, bewitched, or deluded; or they can be called zombies or mankurts.</p>
<p>…He never even considered running away. For any slave owner, the worst possible scenario is a slave revolt. Every slave is a potential rebel. Mankurt was a one-of-a-kind exception – the impulses toward rebellion and disobedience were fundamentally alien to him. He knew nothing of such passions. And so there was no need to watch over him, to keep guards on him, and certainly no reason to suspect him of secret plots. Mankurt, like a dog, recognized only his masters. He did not interact with others. All his thoughts revolved around satisfying his hunger. He knew no other concerns. Yet he carried out the tasks entrusted to him blindly, diligently, and unwaveringly…</p>
<p class="attr"><em>– Chingiz Aitmatov. “And the Day Lasts Longer Than a Century”, 1980.</em></p>
<p>According to Chingiz Aitmatov’s novel “A Day Lasts Longer Than a Century”, the image of the mankurt is a metaphor for a person deprived of memory, connections, kinship, values, and free will. He is a slave-like creature, completely subservient to his master and remembering nothing of the past or of kinship – that is, a person without his own ideas, without his own convictions, and without any concept of good and evil [22]. Such is the ultimate result of ideal authoritarian influence. After all, it was precisely the rejection of all forms of kinship – including genealogical ties – that was cultivated among the population during the Soviet Red Terror, amid repressions under articles concerning treason against the motherland, espionage, counterrevolutionary or antisoviet activities, and other charges against so-called enemies of the people. It was asserted that kinship ties are unquestionably based on absolute trust and mutual information-sharing, particularly in political and personal terms, and the phenomenon of forgetting one’s kinship manifested itself quite literally. A “Mankurt” is not merely an ideal executor; it is a person who has lost the capacity for inner resistance. He has no views of his own and no independent stance, because he has forgotten how to form them based on his own life values and conscious, constructive reflection. He is loyal, conformist, safe, and subjugated to his master. It is precisely such people who are alien to any impulse toward resistance, struggle, protest, rebellion, or disobedience; they fear crowds and organization. The ideal slave is not interested in public, civic, or social life; he is indifferent to his fellow man. He is concerned only with his own belly of consumerism – the satisfaction of everyday or basic needs. All of this leads only to an extreme degree of exploitation and oppression by his master, to whose delight they voluntarily surrender – which, to some extent, serves as an allegory for the present day.</p>
<blockquote>
<p><em>Those</em> who are willing to sacrifice essential liberty for the sake of temporary safety deserve neither liberty nor safety.</p>
</blockquote>
<p class="attr"><em>Benjamin Franklin – in the widely known wording of a 1755 letter,<br />
written on behalf of the Pennsylvania Assembly to the governor</em></p>
<p>The development in a person not only of authoritarian traits but also of characteristics of the so-called “dark triad” – Machiavellianism, narcissism, and psychopathy (and, in the case of the “dark tetrad”, sadism as well) – directly serves the interests of those in power over them. Although these dark aspects are present to one degree or another in every person, a dictatorship – rather than suppressing and neutralizing their manifestations – on the contrary, massively, implicitly, and indirectly encourages their development and entrenchment in every individual. This is achieved through cultural codes, propaganda, behavioral models, and social norms, shaping a subject who is convenient, predictable, obedient, and easily controlled by the regime. The ruling dictator, possessing a pronounced Machiavellian trait, acts in full accordance with utilitarian consequentialism (radical agent-relative consequentialism), where the end justifies the means [23]. However, even from the standpoint of consequentialism itself, such an antisocial strategy cannot be considered moral: the harm universally inflicted on society, the destruction of trust, the increase in suffering, and the overall decline in well-being render the ultimate goal flawed, no matter how objective or legitimate it may be [24]. In any case, the strategies of authoritarianism run counter to the public good and basic moral norms; they cannot be justified even from a utilitarian standpoint. The destructive effect is inevitable both as a result of achieving any goal and in the process of its expedient implementation. Power based on the cultivation of evil and ignorance is incapable of bringing about good and progress – it merely spreads suffering and entrenches it within the system.</p>
<p>Dialectical logic, which operates with vague and fluid concepts, often takes on the character of a sophism that asserts that contradictions are the driving force of development. This development is supposed to be purposeful and leading to a higher state, essentially achieved by resolving the contradictions between the thesis and the antithesis through synthesis. However, such a claim is nothing more than a metaphysical dogma based on an unquestionable assumption and magical thinking. Within a scientific framework, such an unverifiable construct possesses neither falsifiability, nor verifiability, nor predictive power, nor scientific value [25]. Nevertheless, the limited application of such logic is permissible in situations where a system is formed from initial data that partially or completely contradict one another and are in a state of logical conflict, where they ignore or mutually exclude one another. In such cases, when each of the contradictory parts appears to be equally plausible, it is necessary to examine each of them. However, the key point remains that none of the claims is required to be true – each may turn out to be false. This approach is particularly favored in demagoguery and propaganda, where the goal is not to convey reliable information backed by verifiable data, but to create a sense of absolute uncertainty and chaos in the listener. Instead of a single falsifiable claim, the listener is bombarded with a deluge of interpretations, speculations, unanswered questions, unprovable hypotheses, conspiracy theories, and implausible scenarios.</p>
<p>Obscurantism can manifest itself in various forms: intellectual laziness, deliberate isolation from argumentation, and pseudo-discussion accompanied by the disregard, devaluation, and inconsistency of intermediate logical results (checkpoints). Another form may be epistemic deafness, which precludes the acceptance of logical arguments and explanations. It may be combined with obscurantism, seasoned with elements of egocentrism, solipsism, relativism, postmodernism, and subjective idealism or subjectivism – a worldview in which a person arbitrarily defines the criteria for what constitutes an “other’s” or “unacceptable” experience, shielding themselves from it with an emotional reaction rather than rational analysis. It can also manifest as naive empiricism, casuistic or selective skepticism, cognitive isolationism, and everyday agnosticism. The roots of such attitudes may stem from conformism, an acutely sensitive perception of public opinion, an imaginary and obsessive concern with others’ judgments (about oneself), and a desire for external approval – including due to narcissistic vulnerability, dependence on affiliation, and the subordination of the individual to society. Additionally, their spread may be facilitated by an anti-scientific stance, the artificial creation and maintenance of an information bubble, social polarization, the absence of a culture of debate and an acceptable level of discussion; and their intensification – by conspiracy theories and magical thinking, anti-intellectual preferences, the phenomenon of the spiral of silence and groupthink, including the so-called Abilene paradox.</p>
<p>Hottentot morality, based on double standards and hypocrisy, and heteronomous ethics appear at first glance to be disparate phenomena. In practice, however, the Machiavellian uses them together as tools of manipulation [26]. Hottentot morality serves as a justification for xenophobia and belligerence: “Let my hut burn down, as long as my neighbor’s cow dies”; “It doesn’t matter that mine died – what’s bad is that my neighbor’s is still alive”; “Let my cow die, as long as my neighbor’s two die”; “It’s good to steal a cow from a stranger, but under no circumstances from one’s own – that’s evil”. These attitudes illustrate moral relativism and the primitive logic of “friend-foe”, “us versus them”, which leaves no room for universal moral principles. A person who adheres to heteronomous ethics follows a morality imposed from the outside. In a cynical society dominated by double standards, they unwittingly absorb this narrative, adopting social norms as their own morality. Their behavior becomes opportunistic, dependent on the external environment, much like a weather vane adjusting to the winds of circumstance. Heteronomous morality does not involve rational reflection or a critical approach, but rather repeatedly echoes the propaganda agenda transmitted from the outside, eventually cementing it in the mind as the norm. In an environment dominated by Newspeak – shaped simultaneously by coercion from those in power and by society’s passive, complacent acquiescence – direct expression becomes impossible. Communication is forced to take on an allegorical form, akin to Aesopian language, which slows down and complicates the transmission of meaning, reducing its quality, effectiveness, constructiveness, and clarity. The cynicism of doublethink allows a person to put on and take off an imaginary moral mask, hiding beneath it their true attitude toward both themselves and others. This pretense and facade, imposed by conformist norms constructed by the authorities, reinforces moral relativism and makes the individual vulnerable to external influence. Avoiding this duality and vulnerability is possible only through adherence to an autonomous ethic – an ethic based on universal, absolute, and consistent moral principles. Such a moral code is open to criticism, rational reflection, and joint discussion – including in public debate – and is oriented toward both internal value convictions and the common good.</p>
<p>Transcendental holism asserts that it is impossible to know an object in its entirety: neither the sum of its parts nor an analysis of its components will bring one closer to the absolute truth, which is supposedly embedded in an inaccessible transcendental design. The very demand to know the transcendent renders any claim to objective knowledge untenable by definition. According to this approach, truth does not exist in the accessible aspects of being, but only in an indivisible, holistic continuum that can only be intuitively grasped but cannot be logically or empirically verified [27]. It follows that any analytical approach is supposedly doomed to be false, and knowledge gained through decomposition into elements is declared to be inherently erroneous. Moreover, in this paradigm, the subject is not merely an observer but a part of the whole or a creation in the image and likeness of God; thus, the subject is also not subject to objective criticism as an independent researcher. A similar movement, opposed to empiricism, is religious transcendentalism, which proclaims the possibility of genuine knowledge exclusively through divine revelation, spiritual faith, and theology. In such a system, morality is prescribed by divine law, and the church is its earthly expression and sole objective interpreter. The individual’s free will is reduced to a primitive binary choice: either salvation through righteous submission or the fall into sin through any deviation. Theology prefers to mimic scientific doctrine, masquerading as objective knowledge – hence the absurd titles such as “Doctor of Theology”. However, this is merely an imitation and a fiction, whereas the true scientific discipline is the study of religion, a fairly narrow interdisciplinary field of science that is not equated with faith. The same applies to the philosophy of religion, which investigates religious phenomena rather than confirming dogmas. All theological disciplines, grouped under the umbrella term “theology”, are internal, self-contained church practices. Orthodox and official church theology rejects external criticism, avoids communication and discussion, and exists in a state of argumentative isolation. Such a refusal to engage in dialogue, critical thinking, and openness leads to archaism, primitive stagnation, obscurantism, savagery, and barbarism. This becomes particularly dangerous when the members of such organizations themselves cease to perceive one another as individuals: they do not argue, do not doubt, do not seek the truth, but merely repeat the same dogmas over and over. Eschatology – the doctrine of the end of the world, life after death, and the so-called last things – occupies a special place in theology. This set of myths is ideally suited to a dictatorship: it sweetly lulls the critical thinking of the people, indulges pride and vanity, and instills the illusion of being a chosen people. It is precisely here that ideologemes such as the “chosen people”, “God is with us”, the “messianic people”, the “victorious people”, the “holy land”, the “holy country”, the “holy war”, the “martyr’s sacrifice”, “righteous anger”, and so on arise. When necessary, eschatological consciousness easily transforms into ritualized propaganda of national superiority, the sacralization of violence, and self-denial. On an individual level, eschatology cultivates contempt for earthly life. It declares it unimportant, secondary, overrated, even illusory. What matters most is life in God and for God. This means that human happiness, quality of life, freedom, and development are not goals but obstacles. After all, the most terrifying thing for a person is spiritual death – or, to put it in secular terms, an atheistic life. Self-sacrifice, death for the sake of faith, and contempt for the physical and the worldly – these are the highest values. Herein lies an explosive mixture of exceptional grandeur and necrophilia in eschatology. It constitutes a cult of death and the dead, cloaked in the rhetoric of virtue.</p>
<p>Other transcendental doctrines follow the same line of thought. Creationism is based on a fanatical belief in the existence of a Creator and His plan. Gnosticism is based on the fundamentally possible gnosis – that is, a personal experience of knowing God – accessible to those who follow a spiritual path toward enlightenment. Related doctrines, such as fideism, openly reject rationality, logic, and empiricism, proclaiming faith to be the sole source of truth. Neo-vitalism also belongs to this category – the doctrine of a certain immaterial life force or spiritual energy that cannot be reduced to science. Neofinalism asserts that there is an original design in nature and life, and that a certain higher spiritual entity imbues them with meaning, purpose, and purposefulness. According to this idea, responsibility for everything that happens lies with this supreme mind, and humans must simply follow its will. Such a stance completely eliminates the autonomy of human will and morality, subordinating the individual to supposed instructions set forth from outside in a supreme revelation. Neofinalism embodies a teleological approach that excludes the element of chance and the probabilistic nature of processes. Like neovitalism, it opposes reductionism, but not in an epistemological sense (as the defense of a plurality of methods of cognition), but in an ontological one: Neofinalism does not so much explain reality as it adapts it to a predetermined intuitive model and rationalizes this intuition [28–32]. These concepts are closer to mystical holism than to scientific anti-reductionism. Their goal is not cognition, but rather the justification of a desired and intuitively accepted holistic worldview.</p>
<p>Apart from religious denominations, there are other transcendental movements. Spiritualism is the belief in the reality of the afterlife, the existence of a spiritual world, and the possibility of communicating with the spirits of the dead through mediums and séances. Mysticism asserts that knowledge of the Absolute, God, or the Universe is possible not through rational means, but through transrational or irrational experience, emotional union, personal fusion, or intuitive comprehension. This approach is based on emotions, intuition, and faith in the existence of absolute reality and absolute truth [33]. Esotericism is a body of implicit mysteries and teachings, hidden from the uninitiated common people and accessible only to the initiated – those who are supposedly capable of perceiving reality in a special way through psychospiritual practices. This includes occultism, alchemy, astrology, and various syncretic doctrines that claim to reveal certain hidden truths of the universe. Knowledge gained through esoteric experience is highly subjective and lacks verifiability, systematic structure, and scientific methodology. Therefore, esotericism is quite rightly considered a pseudoscience [34]. One might mistakenly take the main idea of this work to be a variant close to mysticism, since it also operates with absolute concepts. However, the fundamental difference lies in the following: most mystical traditions, without bothering with arguments, assert the fundamental comprehensibility of the transcendent, whereas this book explicitly acknowledges its Non-Essentiality and the impossibility of its cognition. Consequently, only two possibilities are admissible: either mysticism deals with the immanent, mistakenly calling it transcendent, or the thesis regarding the knowability of the transcendent is false.</p>
<p>The most mainstream transcendental movement today is panpsychism (polypsychism). This is the idea that all of nature is imbued with life. According to this view, matter possesses rudimentary consciousness, and consciousness as a whole is regarded as its fundamental property, supplemented by the concept of qualia [35]. Alongside this, pseudo-mystics are actively promoting their views: psychics, magicians, and other paranormal adherents of the non-physical spirit, pure being, or absolute consciousness, who claim that subjective experience exists outside of nature. However, they fail to explain exactly where this non-natural existence resides, how it functions, and why it cannot be verified under controlled experimental conditions. Neither of these goes beyond mere speculation, insinuations, and assertions that lack an experimental basis and cannot be tested in practice. However, there are also harmless philosophical, psychological, or religious concepts – such as pantheism, deism, pandeism, evolutionary creationism, escapism, and many others – that pose no threat to the mind.</p>
<p>So, having examined various philosophical schools of thought – from positivism to the body of ideas known as transcendentalism – we can summarize the essence of their opposition. Positivism completely rejects metaphysics, recognizing truth as singular, objective, and verifiable. Postmodernism, on the other hand, denies objectivity and the very idea of truth, declaring it a totalitarian tool of suppression, oppression, and lies that undermines pluralism. Relativism goes further, breaking truth down not merely into metanarratives and discourses, but into every personal and subjective perspective, devoid of universality. In its radical form, sensualism merges with cognitive nihilism and refuses to acknowledge any subjective experience other than its own. Idealism is of limited use, for example, in the pursuit of excellence and the trivial sense of perfectionism. However, despite preserving the concept of the absolute, it does not correlate the absolute with matter, asserting that reality is merely a product of thought. In doing so, it denies objective truth, even if it acknowledges the absolute. Idealism also preserves and promotes the transcendent. Determinism is well-suited for analyzing cause-and-effect relationships, logic, and the intuition associated with them, but it can undermine free will by pointing to its illusory nature, which leads to fatalism, diminishes personal responsibility, awareness, and the inclination toward reflection, and reinforces passivity, conformism, and reductionism. Absurdism and nihilism, along with their rejection of the transcendent and the absolute, also reject morality as well as the very idea of progress. Anarchism, similar in tone to these movements, allows for freedom only in a state of chaos, opposing compatibilism (the compatibility of determinism and freedom), which attempts to reconcile free will with causal necessity. Hedonistic egocentrism, in contrast to eudemonism, leads to numerous negative consequences for society due to its rejection of the equal rights of individuals and its disregard for levels of happiness outside the self. Solipsism denies the reality of anything outside the subjective self altogether. Utilitarian consequentialism may be effective and useful to a limited extent, but its tendency toward paradoxes and moral conflicts makes it vulnerable to instrumentalization within totalitarian regimes. In contrast, deontology is based on moral duties independent of consequences. Ideological indoctrination and the dictates of dogma create conditions under which the individual loses autonomy, drifts toward authoritarian thinking, and acquires and develops traits of the dark tetrad (Machiavellianism, narcissism, psychopathy, and sadism). All of this serves the interests of insidious and despicable ruling structures, rather than those of the individual or society. The dialectical approach operates with unfalsifiable transitions and allows for the substitution of formal-logical contradictions with dialectical ones. In essence, dialectics combines elements of sophistry and magical thinking, since it permits logical contradictions and a belief in an inevitable higher state achieved through synthesis. Obscurantism, due to the natural desire to conserve energy, condemns consciousness to isolation within a bubble of self-delusion, to a severance from knowledge and enlightenment, to a loss of connection with reality, and to regression and stagnation. Hottentot morality relies on hypocrisy and cynicism to maintain contact with reality, while heteronomous ethics shapes a submissive and obedient personality and discourages critical thinking – which is ideal for exploitation and control by the oppressor. Transcendental holism makes understanding fundamentally limited and the attainment of objective ultimate truth impossible, asserting that without access to the transcendent, knowledge of any part will always be incomplete. Its logic leads to a rejection of objective knowledge. Finally, other transcendental (spiritualism, mysticism, esotericism, panpsychism, polypsychism) and theological movements (eschatology, fideism, neovitalism, neofinalism) contradict rationalism most radically: instead of reasoning, they propose a dichotomy in the form of accepting or rejecting sacred, higher knowledge; free thought is suppressed; self-sacrifice is encouraged; and the cult itself takes on the characteristics of a zombie cult and a necrotic cult. All these practices and beliefs stand in direct contradiction to rationalism, the growth of self-awareness, and the affirmation of personal values, while simultaneously facilitating exploitation, manipulation, and control over consciousness so that oppressors can steer their subjects in the direction they desire.</p>
<p>After examining the shortcomings of harmful viewpoints, their tricks, and their overall inconsistency, we gain an understanding of how to safeguard our own concept as we develop it. In the next paragraph, we will explore why we should create a systematic composition of our worldview.</p>
<h4 class="ch">0.2. The necessity and distinctive features of synthetic eclecticism</h4>
<p>Science is fragmented into separate disciplines, although the boundaries between some subjects are blurred. Forming a holistic scientific worldview requires a comprehensive integration of all branches of knowledge. In a number of philosophical traditions, eclecticism is commonly regarded as a sign of decline or crisis in thought. At the same time, philosophy itself is divided into various schools of thought, among which ontology, epistemology, and ethics can be considered key. The formation of a coherent philosophical system from fragments also requires a paradigmatic composition and a comprehensive combination of ideas. Critics of eclecticism may confuse it with syncretism. Syncretism, like the syncretic thinking that constitutes it, combines disparate and contradictory positions without any interaction between them, and without principles, methodology, foundations, elaboration, or a holistic synthesis. Eclecticism, on the contrary, interactively and thoroughly combines positions, analyzes and eliminates contradictions, and creatively synthesizes from them a new, consistent set of principles. The discovery and confirmation of a theory of everything in physics will undoubtedly be regarded as an unprecedented step in the development of science. However, when it comes to progress in philosophy, a similar step – or even an attempt at one – is viewed by some in a strictly negative light. Opponents of progress and competition are capable of masquerading as one form of constructive discourse or another for the sake of sabotage and subversion in their own interests. Infantile syncretism is successfully distinguished from synthetic eclecticism. The formulation and presentation of synthetic eclecticism in this book are driven by several key reasons:</p>
<p class="num">1. The uniqueness of the proposed perspective;</p>
<p class="num">2. The organic integration of paradigms, free from their contradictions, as well as flaws, shortcomings, and vulnerabilities;</p>
<p class="num">3. Resisting the imposition of artificial, false values on free-thinking individuals who are nonetheless subject to dictatorial control, and helping them achieve liberation through rational self-awareness achieved by thinking.</p>
<p>A serious mistake is the demonstrative disregard for philosophy and metaphysics on the part of a significant portion of scholars and prominent scientific educators who consistently adhere to quasi-positivist views. This disregard often extends to religious topics as well: a refusal to pay attention to religious judgments and even to gain a superficial familiarity with the study of religion. Meanwhile, even a limited familiarity with religious beliefs, laws, and dogma can significantly broaden one’s understanding of the diversity of cognitive forms and epistemological strategies of knowledge. Furthermore, knowledge of religious norms allows one to recognize the hypocrisy of some of their adherents and, if necessary, remind them of how they present themselves to those around them. It also helps one better understand the sincere commitment of others whose behavior truly aligns with their professed beliefs.</p>
<p>Another serious mistake is the rejection of the concept of the absolute by a number of philosophical schools, particularly existentialism and physicalism. Postmetaphysics, for example, asserts that the absolute is unattainable and denies the very existence of absolute truths. This undermines the foundation for any kind of universal knowledge and makes it impossible to form a coherent picture of reality. Despite its originally religious and transcendent origins, the concept of the Absolute has, over time, been secularized and has gained significance in logic, mathematics, the natural sciences, and philosophy. It has become an acceptable and even necessary element of the theoretical framework for describing universals, ultimate categories, and epistemological reference points. To avoid confusion, the term “absolute” in the context of this work does not imply a meaning synonymous with the Absolute. The Absolute is a separate concept, identical to the highest spiritual essence (God). Capitalizing “Absolute” indicates the secularized, logical-mathematical meaning of the concept of the absolute.</p>
<p>Kant’s philosophy includes the idea of the absolute reason, which can be briefly formulated as the ability of reason, directed toward the unconditional, to comprehend things-in-themselves – that is, to form regulative ideas about them beyond the bounds of sensory experience, which guide cognition (without claiming constitutive knowledge of them), and to construct transcendental ideas as regulative principles (guiding reason toward the unconditional). The development of regulative principles in any system of knowledge, including philosophy, is impossible without systematic self-criticism, which is necessary for identifying inaccuracies, errors, and fallacies. The corresponding idea explored in this book, on the contrary, contrasts the absoluteness of truth, morality, knowledge, and reason with all transcendent concepts. The non-essential Nothing can be understood as absolute in the sense of the complete negation of being. Absoluteness is already embedded as a basic premise whenever Nothingness is mentioned; however, it is worth explicitly emphasizing this unconditional nature.</p>
<p>Instead of the Non-Essential manifestations of Nothingness – imposed through religious or authoritarian narratives by means of dogma and diktat – the reader will be invited to reflect on philosophical judgments, but only after first becoming aware of the very foundations that were previously used as arguments against the very act of reflection itself. Chapter Three will offer a comprehensive view of the forms of subjugation and enslavement of the human mind and the rational principle.</p>
<p>If, after examining the principles of a religious movement, it becomes clear that its followers – despite acknowledging that their morality is heteronomous – nevertheless voluntarily and subjectively accept this system of moral norms, this allows for a deeper understanding of their motivations, incentives, behavioral boundaries, and potential models for predicting their actions. In the event of a contradiction between their actions and the principles to which they themselves have agreed, an opportunity arises for reasoned criticism. Such criticism may lead either to a rejection of previously accepted moral norms – and, as a consequence, of membership in the religious movement – or to a revision of behavior toward compliance with those norms and the prevention of similar violations in the future. This is an underappreciated yet effective mechanism applicable both to the development of personal awareness of one’s own values and interests and to interpersonal communication, the fostering of tolerance and assertiveness, and the overcoming of polarization, apathy, and apolitical attitudes. Moreover, it can play an important role in the prevention of crime by fostering an awareness of personal responsibility for one’s own actions.</p>
<p>A similar mechanism could also be implemented in secular contexts, using a deontological approach to the public declaration of one’s own principles. Such a socio-ethical project could be implemented in the form of a deontological declaration reflecting an individual’s axiological creed. This declaration could serve as a tool for establishing a normative framework for the application of the principle of proportionality of punishment, including for the implementation of the maxim “No freedom for the enemies of freedom”. Thanks to this approach, it would become possible to legitimately impose restrictions and special measures on those who consider themselves superior to others, whose rights may be compromised, who condone the arbitrary use of force and unprovoked violence, declare unconditional privileges over others, and claim the right to biased law enforcement or exemption from universal legal equality without the impartial rule of law. The use of a deontological declaration would also make it possible to assess the validity and appropriateness of such restrictions and punishments: if a person permits a certain form of punishment or measure for others, they must first and foremost be prepared to apply it to themselves.</p>
<p>The philosophical deconstruction of the transcendent in this concept partly builds on the ideas of Friedrich Nietzsche while drawing on the principles of Popperian epistemology, positivism, and scientific skepticism [36–37]. The new approach is based on the ontological denial of errors as non-existent in immanent and objective reality. In this context, Nothingness is interpreted as an ontological synonym for falsehood, since any error is Non-Essential if it has not led to consequences in objective reality.</p>
<p>The uniqueness of this approach lies in its dismantling of the traditional ontological dichotomy between the immanent and the transcendent, while preserving the value of the immanent and of absolute concepts. The metaphysics that is rejected is the transcendent and all its derivatives (God, the soul, eschatology, etc.), since they are indistinguishable from the non-essential Nothing. At the same time, the usefulness of metaphysics is acknowledged at various levels: on the personal level – in the form of existentialism – and on the external level – as epistemological physicalism.</p>
<p>Without the creation of a powerful philosophical concept, the consistency, integrity, and comprehensiveness of an adequate worldview will always, to a greater or lesser extent, yield to obscurantist, marginal analogues. Thus, there is a persistent need to create a synthetic and eclectic concept that would honestly and consistently provide comprehensive answers to fundamental philosophical questions, while at the same time courageously, firmly, and uncompromisingly opposing those doctrines that are partially or entirely directed against its principles. This need becomes particularly pressing in the face of external, dictatorial pressure exerted through mythologized ideologemes grounded in a comprehensive philosophical paradigm.</p>

let lang = new URLSearchParams(location.search).get("lang");
if (!T[lang]) lang = (navigator.language || "ru").toLowerCase().startsWith("ru") ? "ru" : "en";
let r = true, l = true;

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.title = t.title + " — " + t.author;
  $("meta[name=description]").content = t.desc.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim().slice(0, 300);
  document.querySelectorAll("[data-t]").forEach(e => e.innerHTML = t[e.dataset.t]);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === lang));
  const eb = $("#cEbook");
  eb.onerror = () => { eb.onerror = null; eb.src = "cover-audio.jpg"; };
  eb.src = "cover-ebook-" + lang + ".jpg";
  eb.alt = t.title + " (" + t.readSub + ")";
  $("#cAudio").alt = t.title + " (" + t.listenSub + ")";
  const plan = r && l ? "both" : r ? "read" : l ? "listen" : "";
  $("#fRead").checked = r; $("#fListen").checked = l; $("#fBoth").checked = r && l;
  $("#covers").dataset.plan = plan || "both";
  const b = $("#buy");
  if (plan) { b.href = CONFIG.links[lang][plan]; b.removeAttribute("aria-disabled"); }
  else { b.removeAttribute("href"); b.setAttribute("aria-disabled", "true"); }
  b.title = t.tg;
  $("#peek").textContent = t.exOpen;
  const ex = $("#exText");
  if (ex.dataset.l !== lang) { ex.innerHTML = $("#ex-" + lang).innerHTML; ex.dataset.l = lang; }
  $("#mail").href = "mailto:" + CONFIG.email;
  const sx = parseFloat(new URLSearchParams(location.search).get("x"));
  if (isFinite(sx)) $("#covers").style.setProperty("--covers-x", sx + "%");
}
$("#fRead").onchange = e => { r = e.target.checked; render(); };
$("#fListen").onchange = e => { l = e.target.checked; render(); };
$("#fBoth").onchange = () => { r = l = true; render(); };
$("#peek").onclick = () => $("#excerpt").showModal();
$("#close").onclick = () => $("#excerpt").close();
$("#excerpt").addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.close(); });
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
  lang = b.dataset.l;
  try { history.replaceState(null, "", "?lang=" + lang); } catch (e) {}
  render();
});
render();
</script>
</body>
</html>
